            try {
                window.jQuery = window.$ = require("./tyrano/libs/jquery-3.6.0.min.js");
            } catch (e) {}
            
            try{
                
                if(window.studio_api){
                    //Win Macなど パッケージング時 
                    window.studio_api = window.studio_api;
                    window.process = window.studio_api.ipcRenderer.sendSync("getProcess");
                }else if (window.opener.window.studio_api) {
                    //プレビューのとき
                    window.studio_api = window.opener.window.studio_api;
                    window.process = window.opener.window.studio_api.ipcRenderer.sendSync("getProcess");
                }
                
            }catch(e){
            
            }

/* === 空中圣阁 web shell: boot / rotate helpers === */
#boot_overlay{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#123049,#071525 70%);color:#eaf5ff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;transition:opacity .5s ease;text-align:center}
#boot_overlay.bo-hide{opacity:0;pointer-events:none}
#boot_overlay .bo-title{font-size:30px;letter-spacing:10px;color:#bfe9ff;margin-bottom:14px}
#boot_overlay .bo-msg{font-size:13px;line-height:2;color:#8fb3cc;max-width:82vw;white-space:pre-wrap;letter-spacing:1px}
#boot_overlay .bo-spin{width:26px;height:26px;border:2px solid #2a4d68;border-top-color:#68d3ff;border-radius:50%;margin:0 auto 18px;animation:bo-spin 1s linear infinite}
@keyframes bo-spin{to{transform:rotate(360deg)}}
#rotate_hint{display:none;position:fixed;inset:0;z-index:2147482000;background:#071525f5;color:#eaf5ff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;align-items:center;justify-content:center;text-align:center}
#rotate_hint.rh-show{display:flex}
#rotate_hint .rh-inner{padding:28px;max-width:86vw}
#rotate_hint .rh-icon{font-size:56px;line-height:1;color:#68d3ff;margin-bottom:14px}
#rotate_hint .rh-title{font-size:22px;letter-spacing:6px;margin-bottom:10px}
#rotate_hint .rh-desc{font-size:13px;color:#9ab5cb;letter-spacing:1px;line-height:1.9}
#rotate_hint .rh-btns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#rotate_hint button{font-family:inherit;font-size:15px;padding:12px 26px;border-radius:8px;border:1px solid #68d3ff;background:#102b43;color:#eaf5ff;letter-spacing:2px}
#rotate_hint button.primary{background:#17618b}
</style>

    <script>
window.__EMBED__ = {"data/system/Config.tjs": "// Config.tjs - ティラノスクリプト 設定\n// Copyright (C) 2012-2021 ShikemokuMK\n\n;global.config_version = \"6.00\"; // この行を消さないでください\n\n// ティラノスクリプトの基本設定になります。\n\n// このファイル内で設定できる項目は、すべて\n// ;設定名 = 値;\n// の形式になっています。\n// 「追加の設定」を除いて、設定は各項目につき１行で記述する必要があります。\n\n\n//------------------------------------------------------- 全体の設定 -----\n\n\n// ◆ タイトル\n// ウィンドウのキャプション(タイトル)および\n// ブラウザの場合は、タイトルに指定されます\n;System.title = \"空中圣阁\";\n\n\n// ◆ プロジェクト一意の識別名称　ティラノスクリプト独自設定\n// プロジェクト固有の文字列を指定してください。特に同一ドメイン上にプロジェクトを配置する場合は必ず指定してください\n;projectID = kongzhongshengge;\n\n// ◆ リリースバージョンを数値で指定します。全角・英数字は使用できません。\n// パッチ機能において重要な役割を果たします。パッチファイルで指定されたバージョンがこの数値より大きい場合はパッチが適応されます。\n// ゲームをアップデートした場合、必ず以下の数値を上げておくことをオススメします。\n;game_version = 0.0;\n\n// 画面比率を固定にするか否か\n// \"fit\"を指定すると、プレイヤーが閲覧している端末に合わせて自動的に調整されますが、縦横比率は保たれません。\n// \"fix\"を指定すると縦横比率は保たれます。ただし、端末によっては何も表示されない空白領域ができてしまいます。\n// \"default\"を指定すると縦横比の調整は一切行われません\n;ScreenRatio = fix;\n\n//パッチファイルが配置されている場合、起動時に自動的に反映するか否か。\n//trueを指定すると実行ファイルと同一フォルダにtpatchファイルが存在する場合反映してから起動します。\n//（MacOS Sierra 以降の場合は home/ユーザー名/_TyranoGameData/　以下）\n//falseを指定した場合 起動後に[apply_local_patch]タグを使って反映することもできます。\n;patch_apply_auto = true;\n\n// 画面をセンタリングするか否か\n// アプリ化などでゲーム画面が画面外に出てしまうような場合にfalseを指定すると改善する場合があります。\n;ScreenCentering = true;\n\n// カメラ機能を使えるようにするかを設定\n// trueで有効　false で無効です。\n;useCamera = true;\n\n// 3D機能を利用できるようにする\n// trueで有効　false で無効です。\n// 有効にすると起動時間が長くなりますので、必要ない場合はfalseが推奨です。\n;use3D = false;\n\n// ◆ タグのパラメータの値に含まれる空白をどのレベルで保持するか（1、2、3のいずれかで指定）\n// 1 : 空白をまったく保持しません（すべての空白を削除します）\n// 2 : 内部の空白だけ保持します（両端の空白を削除します）\n// 3 : すべての空白を保持します\n// たとえば [bg storage=\" my room.jpg  \"] というタグのstorageパラメータの値は、\n// それぞれのレベルで次のように解釈されます。\n// 1 : \"myroom.jpg\"\n// 2 : \"my room.jpg\"\n// 3 : \" my room.jpg  \"\n// もし既存のゲームプロジェクトのティラノスクリプト本体（V514以前）をV515以降のバージョンで上書きしたときに\n// それまで正常に動作していたゲームが動作しなくなった場合は、ここを 1 に変更してみてください。\n;KeepSpaceInParameterValue = 2;\n\n//-------------------------------------------- ウィンドウや動作の設定 -----\n\n// ◆ 画面サイズ\n// scWidth に画面の幅、scHeight に画面の高さをピクセル単位で指定します。\n\n;scWidth = 1920;\n;scHeight = 1080;\n\n// ◆ チャットノベル形式\n//　V5より。trueにするとチャットストーリー形式でゲームがプレイできます。\n;vchat = false;\n\n// ◆ チャットノベル形式のメニュー\n// チャットノベルで便利なセーブやロードなどを備えたメニューを表示するか否か。\n;vchatMenuVisible = false;\n\n// ◆ 文字表示スピード\n// delay で指定した場合はその値が優先されます。resetdelayで元に戻ります\n;chSpeed = 30;\n\n// ◆ 文字表示スピード (ミリ秒/文字)（未実装）\n;chSpeeds.fast = 10; // 「高速」文字表示スピード\n;chSpeeds.normal = 30; // 「普通」文字表示スピード\n;chSpeeds.slow = 50; // 「遅い」文字表示スピード\n\n// ◆ 文字表示の演出\n// テキストの表示演出を指定できます。noneを指定すると演出が無効になります。\n// 指定できる名前\n// fadeIn/fadeInDown/fadeInLeft/fadeInRight/fadeInUp/rotateIn/zoomIn/slideIn/bounceIn/vanishIn/puffIn/rollIn/none\n;defaultChEffect = none;\n\n// ◆ 文字表示の演出スピード\n// defaultChAnimの演出が有効な場合、演出にかける時間を指定します。sは秒を表します。\n;defaultChEffectSpeed = 0.2s;\n\n\n// ◆ スキップスピード (ミリ秒/文字)\n//スキップ時にどれくらいの早さで進むかを設定できる\n;skipSpeed = 30;\n\n// ◆ スキップの時、演出もスキップするかを設定できる\n//trueで有効。背景変更・キャラクター表示・非表示の速度をが短くなります。\n;skipEffectIgnore = true;\n\n\n// ◆ オートスピード\n//autoSpeedはオート時にどれくらいの早さで進むかをミリ秒設定できる\n//autoClickStop は 画面クリックでオートが停止するかどうかを設定。trueを指定すると、クリックでオートが停止\n;autoSpeed = 1300;\n;autoClickStop = true;\n\n//オート時の待ち時間を文字数に応じて調整できます。１文字あたり指定したミリ秒分がautoSpeedの時間に追加された時間待ちます\n//例えば10文字のテキストだった場合、60*10 = 600ms + autoSpeedの値\n;autoSpeedWithText = 60;\n\n\n// ◆ マウスカーソル\n// マウスカーソルを指定します。画像ファイルも指定することができます\n// defaultを指定すると、通常の矢印になります。\n// 独自の画像カーソルを使用したい場合はimageフォルダに配置した上で、ファイル名を指定してください\n// [cursor]タグを使って、ゲーム中に変更することもできます。\n\n;cursorDefault = default; // 通常のマウスカーソル\n\n// ◆ デフォルトのサウンド・動画フォーマットを指定\n// V5以降は未使用。特に変更する必要はありません。\n\n;mediaFormatDefault = ogg;\n\n// ◆ BGMの音量 0 〜 100 で指定します。\n;defaultBgmVolume = 100;\n\n// ◆ SEの音量 0 〜 100 で指定します。\n;defaultSeVolume = 100;\n\n// ◆ 動画の音量 0 〜 100 で指定します。\n;defaultMovieVolume = 100;\n\n// ◆ BGMで使用するスロット数をあらかじめ定義します。\n// こちらは、スマートフォンブラウザで適切に音を再生したい場合は必須です\n;defaultBgmSlotNum = 1;\n\n// ◆ サウンドで使用するスロット数をあらかじめ定義します。\n// こちらは、スマートフォンブラウザで適切に音を再生したい場合は必須です\n;defaultSoundSlotNum = 3;\n\n\n\n// ◆ コンフィグ（メニュー）機能表示\n// セーブ・ロードやタイトルに戻るといった一連の機能を表示するかを指定します\n;configVisible = true;  //コンフィグアイコンを表示\n;configLeft    = -1     //コンフィグアイコンの左位置を指定できます。-1の場合は画面右下\n;configTop     = -1     //コンフィグアイコンの上位置を指定できます。-1の場合は画面右下\n\n// ◆ セーブの方式を指定\n//注意：途中でセーブ方式を変更することはできません。\n//webstorage :WebStorage領域に保存します。あらゆる環境で利用できますが、セーブデータが大きくなりすぎた場合に保存できなくなります\n//webstorage_compress :圧縮を施したうえで、WebStorage領域に保存します。セーブ・ロードに時間がかかりますが、保存できるデータ量は大きく増加します\n//file : セーブデータを sav ファイルとして書き出します。この場合PCゲームにしか利用できません。セーブデータを移動したり、容量制限の心配が不要です。\n\n;configSave     = webstorage\n\n// セーブ・ロード時にサムネを表示したくない場合はこちらをfalseに設定してください\n// 一部古い機種でセーブ機能が動作しない場合などにサムネを表示しないことで解決しないことがあります。\n;configThumbnail    = true;\n\n// サムネイル画像を使用する場合の画質を指定できます。\n// ブラウザやスマホ対応で、WebStorage領域を使用する場合は low か middle がおすすめです。\n// low:最低画質(jpeg)　middle:中画質(jpeg)  high:最高画質(png)\n;configThumbnailQuality = middle ;\n\n// サムネイル画像を使用する場合の画像サイズを指定できます。\n// WebStorage領域を使用する場合は 数字を小さくしてセーブデータの容量を少なくするのがおすすめです。\n// 0.01 ～ 1.0 (画面サイズそのまま)\n;configThumbnailScale = 0.3;\n\n// セーブスロットの数を指定できます。\n// ただし、configSaveの形式がwebstorageの場合、５個程度に抑えておかないと容量不足でセーブできなくなる可能性があります。\n// スロット数はゲーム開始後は変更できません。その場合、セーブデータをすべて消した上で再度開始する必要があります。\n;configSaveSlotNum = 5;\n\n// セーブデータに表示される日時のフォーマットを指定できます。\n// (設定例)                  (結果例)\n// yyyy/M/d h:mm:ss     →   2022/1/1 0:00:00\n// yyyy/MM/dd hh:mm:ss  →   2022/01/01 00:00:00\n// yyyy年M月d日 h時mm分    →   2022年1月1日 0時00分\n;configSaveDateFormat = yyyy/M/d h:mm:ss;\n\n\n// ◆ セーブデータ移動の可否を設定します。（PCゲーム限定）\n// 他人のセーブデータ取得し配置することで、ゲームを改造するチート行為は危険です。\n// ティラノスクリプトではセーブデータの改変を検知するとゲームの起動を停止する機能が備わっています。\n// ただし、頻繁にアップデートを行うケース等において、この機能が誤検知してしまうケースがまれに発生します。\n// その場合、ゲーム本体のインストール場所（フォルダ名）を変更することで回避できます。\n// trueを指定すると、セーブデータの移動と上書きが可能になりますが、信頼できない場所からセーブデータを取得し配置しないような注意喚起も合わせてお願い致します。\n;configSaveOverwrite = false\n\n\n// ◆ バックログ機能\n// バックログ機能用にテキストの最大保持数を保存できます。\n// 保存されたデータはtf.system.backlog に配列として格納されます。\n// 0の場合、保存を行いません。\n;maxBackLogNum = 50;\n\n// ◆ ラベル記録\n// 重要：既読管理を有効にしたい場合は必ずtrueを指定して下さい\n// 自動的に「読んだ」ラベルを記録するかどうかを指定します。\n// この設定が false でなく true になっていると、ラベルを読むごとにシステム\n// 変数 (sf.record) に\n// trail_シナリオファイル名_ラベル名\n// という変数名の変数に 1 が加算されます。\n// たとえば first.ks の *start というラベルであれば sf.record.trail_first_start とい\n// う変数名になります。まだ通過していないカ所では 未定義 ( undefined として見なされ\n// ます ) になっています。\n//\n// 次のラベルに到達した時に ラベルの終了と見なされます。\n// 吉里吉里/KAGとは仕様が異なりますのでご注意下さい。\n// つまり、jump で他のシナリオファイルにジャンプしただけでは、記録されません。\n// シナリオファイルの最初にラベルを配置しておくと記録されます\n;autoRecordLabel = false;\n\n// ◆ 既読管理\n// 既読管理に関連する設定です\n// 以下を有効にするには autoRecordLabel に trueを指定する必要があります\n// 未読スキップを有効にするかどうかを指定します。 true を指定すると有効です\n;unReadTextSkip = false\n\n//既読のテキストの色(0x000000形式)を変更できます。default を指定すると既読テキストでも色は変わりません。\n;alreadyReadTextColor = 0x87cefa\n\n// ◆ 初期状態の前景レイヤの数\n// 必要なければ 0 を指定してかまいません。\n// 数が多いと速度が低下したりメモリを消費しますので、必要以上に大きな数を指\n// 定しない方が良いでしょう。\n// laycount タグでシナリオ内でも変更できます。\n;numCharacterLayers = 3;\n\n\n// ◆ 前景レイヤの左右中心位置指定\n// +---------+\n// |         |\n// | |  |  | |\n// | |  |  | |\n// +---------+\n// image タグあるいは img タグの pos 属性で指定する前景レイヤの 位置名 (\n// left や lecft_center など ) とそれぞれに対応する 中心位置 ( x 座標 ) を\n// 指定します。;scPositionX.位置名 = 中心位置; の形式で指定します。\n;scPositionX.left = 160;\n;scPositionX.left_center = 240;\n;scPositionX.center = 320;\n;scPositionX.right_center = 400;\n;scPositionX.right = 480;\n\n\n// 簡易な記号\n// ( pos 属性に指定する left, left_center, center, right_center, right を\n//  それぞれ l, lc, c, rc, r でも指定できるように別名を定義します )\n;scPositionX.l = scPositionX.left;\n;scPositionX.lc = scPositionX.left_center;\n;scPositionX.c = scPositionX.center;\n;scPositionX.rc = scPositionX.right_center;\n;scPositionX.r = scPositionX.right;\n\n\n// ◆ 初期状態のメッセージレイヤの数\n// 前景レイヤと違って、0 を指定することはできません。これも必要な数だけ確保\n// するようにすべきです。laycount タグでシナリオ内でも変更できます。\n;numMessageLayers = 2;\n\n\n// ◆ 初期状態でメッセージレイヤを表示するかどうか\n// true を指定するとメッセージレイヤ0が初期状態で表示状態になりますが、\n// false を指定すると初期状態ではすべてのメッセージレイヤは初期状態で非表示\n// になります。\n;initialMessageLayerVisible = true;\n\n\n// ◆ 左右上下マージン\n// マージン (余白) を pixel 単位で指定します。メッセージ枠用の画像を指定し\n// た場合は、メッセージ枠の表示範囲内に設定する必要があります。\n// これらは、position タグの marginl, maringt, marginr, marginb 属性に対応\n// します。\n;marginL = 8; // 左余白\n;marginT = 8; // 上余白\n;marginR = 8; // 右余白\n;marginB = 8; // 下余白\n\n\n// ◆ 初期位置\n// これらは、position タグのそれぞれ left top width height の属性に対応しま\n// す。\n;ml = 16;  // 左端位置\n;mt = 16;  // 上端位置\n;mw = 960-32;   // 幅\n;mh = 640-32;   // 高さ\n\n\n// ◆ 「デバッグ」\n// ここをtrueにしておくことでブラウザのコンソールログに各種値が出力されるようになります\n//　ゲームリリース時は必ずfalseにしておきましょう\n\n;debugMenu.visible = true;\n\n\n//-------------------------------------------- メッセージレイヤの設定 -----\n\n// ◆ メッセージレイヤの色と不透明度\n// frameColor には 0xRRGGBB 形式で ( RR GG BB はそれぞれ 2 桁の 16 進数)\n// メッセージレイヤの色を指定します。frameOpacity には 0 ～ 255 の数値で、\n// 不透明度を指定します。メッセージ枠用の画像が指定されている場合は無効で\n// す。\n;frameColor = 0x000000; // position タグの color 属性に相当\n;frameOpacity = 128;  // position タグの opacity 属性に相当\n\n\n\n// ◆ 自動改行/改ページ\n// true を設定すると、行末での自動改行、ページ末での自動改ページが行われま\n// す。false を設定するとこれらが行われない他、禁則処理等もされなくなりま\n// す。\n;defaultAutoReturn = true;\n\n\n// ◆ 右文字マージン （未実装）\n// 禁則処理用にあけておく右端の文字数を指定します。\n// (縦書きモードでは下端の文字数であると解釈されます)\n;marginRCh = 2;\n\n\n// ◆ 文字の大きさ\n// デフォルトの文字の大きさ ( 高さ ) を pixel 単位で指定します。\n;defaultFontSize = 28;  // deffont タグの size 属性に相当\n\n\n// ◆ 行間\n// 行間を pixel 単位で指定します。\n;defaultLineSpacing = 8; // defstyle タグの linespacing 属性に相当\n\n// ◆ 字間\n// 字間を pixel 単位で指定します。\n// デフォルトは 0 で、正あるいは負のオフセットで指定します。\n// 負の数値を指定すると字間が詰まります。正の数値を指定すると字間が空きま\n// す。\n;defaultPitch = 0; // defstyle タグの pitch 属性に相当\n\n\n// ◆ 文字の書体\n// デフォルトのフォント名を指定します。\n// この設定はシステム変数に記録されて、次回起動時に引き継がれるので、\n// userFace の設定を変更し、適用したい場合はシステム変数ファイル\n// カンマで区切って複数のフォントを指定することができます。その場合は、最初\n// の方に書いたフォントが存在すれば、優先されます。\n;userFace = Quicksand, 游ゴシック体, \"Yu Gothic\", YuGothic, \"ヒラギノ角ゴシック Pro\", \"Hiragino Kaku Gothic Pro\", メイリオ, Meiryo, Osaka, \"ＭＳ Ｐゴシック\", \"MS PGothic\", sans-serif, Arial;\n\n\n// ◆ 文字の色\n// デフォルトの文字の色を 0xRRGGBB 形式で指定します。\n;defaultChColor = 0xffffff;  // deffont タグの color 属性に相当\n\n\n// ◆ 文字をボールドにするか\n// する場合は true, しない場合は false を指定します。\n;defaultBold = false; // deffont タグの bold 属性に相当\n\n\n// ◆ ルビサイズ　（未実装）\n// ルビサイズを pixel 単位で指定します。\n;defaultRubySize = 10; // deffont タグの rubysize に相当\n\n\n// ◆ ルビ の表示オフセット（未実装）\n// 負の数を指定するとその pixel 数分、本文に近い位置に表示されます。\n;defaultRubyOffset = -2; // deffont タグの rubyoffset に相当\n\n\n// ◆ 文字のアンチエイリアス効果をするか（なめらかな文字表現）\n// これはゲーム全体の文字に適応されます\n// 0:無効　1:弱めのアンチエイリアス効果　2:強めのアンチエイリアス効果\n;defaultAntialiased = 1;\n\n\n// ◆ 影を描画するか\n// する場合は true, しない場合は false を指定します。\n// 注意：文字の縁取りと同時に使用することはできません。その場合、影は無効になります。\n;defaultShadow = false;  // deffont タグの shadow 属性に相当\n\n// ◆ 影の色\n// 影の色を 0xRRGGBB 形式で指定します。\n;defaultShadowColor = 0x000000;  // deffont タグの shadowcolor に属性に相当\n\n// ◆ 縁取りをするか\n// する場合は true, しない場合は false を指定します。\n;defaultEdge = false;  // deffont タグの edge 属性に相当\n\n// ◆ 縁取りの色\n// 縁取りの色を 0xRRGGBB 形式で指定します。\n;defaultEdgeColor = 0x000000;  // deffont タグの edgecolor に属性に相当\n\n\n// ◆ リンクの強調色 （未実装）\n// リンクを選択したときに出る半透明矩形のデフォルトの色です。\n;defaultLinkColor = 0x0080ff;  // link タグの color 属性に相当\n\n\n// ◆ リンクの不透明度　（未実装）\n// リンクを選択したときに出る半透明矩形の不透明度です。\n;defaultLinkOpacity = 64;\n\n\n// ◆ 縦書きモード\n// メッセージレイヤを標準で縦書きモードにする場合は false ではなく true を\n// 指定してください。\n;vertical = false;\n\n\n//---------------------------------------------- キーボードによるボタン選択の設定 -----\n\n// ◆ キーボードで各種ボタンを選択できるようにするかどうか\n// キーボードでボタンを選択できるようにするなら true、選択できるようにしたくないなら false を指定します。\n// ※キーコンフィグの設定（system/KeyConfig.js）も参照してください。\n// 　ボタンをキーボードで選択できるようにするためには、各種キーに focus_left などのアクションが設定されている必要があります。\n// 　(設定例)\n//     \"37\": \"focus_left\",  // ←\n//     \"38\": \"focus_up\",    // ↑\n//     \"39\": \"focus_right\", // →\n//     \"40\": \"focus_down\",  // ↓\n;useKeyFocus = false;\n\n\n// ◆ キーボードの方向キーなどでボタンを選択したときに最初にどのボタンをフォーカスするか\n// たとえば選択肢が縦に3つ並んでいる状況で下キーを押したとき、一番下のボタンがフォーカスされるようにするか、\n// それとも下キーを押した場合でも固定で一番上のボタンがフォーカスされるようにするか、を設定できます。\n// first : どの方向キーを押した場合でも、固定で一番上のボタンがフォーカスされるようにします。\n// dir   : 上キーを押したときには一番上のボタンが、\n//         下キーを押した場合には一番下のボタンがフォーカスされるようにします。\n// dir-2 : ボタンが2個しかない場合は方向キーどおりにフォーカス（dir）、\n//         選択肢が3個以上ある場合は固定で先頭のボタンがフォーカス（first）されるようにします。\n;firstKeyFocusType = first;\n\n\n// ◆ キーボードでボタンを選択したときに仮のマウスカーソル画像を表示するかどうか\n// true  : 仮のマウスカーソルを表示する\n// false : 仮のマウスカーソルを表示しない\n;keyFocusWithMouseCursor = true;\n\n// ◆ キーボードでボタンを選択したときに「ボタンにマウスカーソルを乗せたときのボタンのデザイン変化」を適用するかどうか。\n// たとえば [glink] の上に実際のマウスカーソルを乗せると「ボタンが明るくなる」などのデザイン変化が起こりますが、\n// このデザインの変化を「キーボードでボタンを選択したとき」にも適用するかどうかの設定です。\n// true  : デザイン変化を適用する\n// false : デザイン変化を適用しない\n;keyFocusWithHoverStyle = true;\n\n// ◆ キーボードでボタンを選択したときのアウトラインの太さ\n// これに 0 を指定すると、キーボードでボタンを選択したときに表示されるアウトライン（外枠の線）がなくなります。\n// ユーザービリティに鑑みると、アウトラインがあったほうがわかりやすいでしょう。\n;keyFocusOutlineWidth = 0;\n\n// ◆ キーボードでボタンを選択したときのアウトラインのスタイル\n// solid  : 1本線\n// double : 2本線\n// dashed : 角が四角い点線\n// dotted : 角が丸い点線\n;keyFocusOutlineStyle = solid;\n\n// ◆ キーボードでボタンを選択したときのアウトラインの色\n// 下記のような指定にも対応します。下記は半透明の白色を指定した例です。\n// rgba(255, 255, 255, 0.5)\n;keyFocusOutlineColor = 0x000000;\n\n// ◆ キーボードでボタンを選択したときのアウトラインのアニメーション\n// none             : アニメーションなし\n// flash            : 滑らかな点滅\n// flash_moimentary : 瞬間的な点滅\n;keyFocusOutlineAnim = flash_momentary;\n\n// ◆ キーボードでボタンを選択したときのアウトラインのアニメーション時間（ミリ秒）\n;keyFocusOutlineAnimDuration = 2000;\n\n\n\n//---------------------------------------------- ゲームパッド操作の設定 -----\n\n// ◆ ゲームパッドによる操作を有効にするかどうか\n// 有効にするなら true を、無効にするなら false を指定します。\n;useGamepad = false;\n\n\n\n//---------------------------------------------- その他の設定 -----\n\n// ◆ ゲーム未保存時にプレイヤーがゲームを閉じようとしたときに警告を出す機能を有効化するかどうか\n// 有効にするなら true を、無効にするなら false を指定します。\n// ここを有効にしたうえで [closeconfirm_on] タグをシナリオに配置してください。\n;useCloseConfirm = true;\n\n\n// ◆ 黒帯のクリックでもテキストを進められるようにするかどうか\n// 黒帯（ゲーム画面の縦横比とプレイヤーのディスプレイの縦横比が合っていないときなど画面の周囲に表示される余白）を\n// クリックしたときにもテキストを進められるようにするなら true を、しないなら false を指定します。\n;offscreenClickable = true;\n", "data/scenario/cg.ks": ";=========================================\n; CG モード　画面作成\n;=========================================\n\n@layopt layer=message0 visible=false\n\n@clearfix\n[hidemenubutton]\n[cm]\n\n[bg storage=\"../../tyrano/images/system/bg_base.png\" time=100]\n[layopt layer=1 visible=true]\n\n[image layer=1 left=0 top=0 storage=\"config/label_cg.png\" folder=\"image\" ]\n\n[iscript]\n    \n    tf.page = 0;\n    tf.selected_cg_image = \"\"; //選択されたCGを一時的に保管\n    \n[endscript]\n\n\n\n*cgpage\n[layopt layer=1 visible=true]\n\n[cm]\n[button graphic=\"config/menu_button_close.png\" enterimg=\"config/menu_button_close2.png\"  target=\"*backtitle\" x=1150 y=40 ]\n\n[iscript]\n    tf.tmp_index = 0;\n    tf.cg_index = 12 * tf.page;\n    tf.top = 100;\n    tf.left = 60;\n    \n[endscript]\n\n[iscript]\n\ttf.target_page = \"page_\"+tf.page;\n[endscript]\n\n*cgview\n@jump target=&tf.target_page\n\n*page_0\n[cg_image_button graphic=\"rouka.jpg,room.jpg,title.png\" no_graphic=\"../../tyrano/images/system/noimage.png\" x=60 y=130 width=160 height=140 folder=\"bgimage\" ]\n[cg_image_button graphic=\"room.jpg\" no_graphic=\"../../tyrano/images/system/noimage.png\" x=250 y=130 width=160 height=140 folder=\"bgimage\" ]\n\n@jump target=\"*common\"\n\n*common\n\n\n*endpage\n\n\n\n[s]\n\n*backtitle\n[cm]\n[freeimage layer=1]\n@jump storage=title.ks\n\n*nextpage\n[emb exp=\"tf.page++;\"]\n@jump target=\"*cgpage\"\n\n\n*backpage\n[emb exp=\"tf.page--;\"]\n@jump target=\"*cgpage\"\n\n*clickcg\n[cm]\n\n[layopt layer=1 visible=false]\n\n[eval exp=\"tf.cg_index=0\"]\n\n*cg_next_image\n\n[image storage=&tf.selected_cg_image[tf.cg_index] folder=\"bgimage\"  ]\n[l]\n[bg storage=\"../../tyrano/images/system/bg_base.png\" time=10]\n\n[eval exp=\"tf.cg_index++\"]\n\n@jump target=\"cg_next_image\" cond=\"tf.selected_cg_image.length > tf.cg_index\"\n\n\n@jump  target=*cgpage\n[s]\n\n*no_image\n\n@jump  target=*cgpage\n\n\n\n", "data/scenario/config.ks": ";=========================================\n; コンフィグ モード　画面作成\n;=========================================\n\n;\tメッセージレイヤ0を不可視に\n\t[layopt layer=\"message0\" visible=\"false\"]\n\n;\tfixボタンをクリア\n\t[clearfix]\n\n;\tキーコンフィグの無効化\n\t[stop_keyconfig]\n\n;\tレイヤーモードの解放\n\t[free_layermode time=\"100\" wait=\"true\"]\n\n;\tカメラのリセット\n\t[reset_camera time=\"100\" wait=\"true\"]\n\t\n;\t前景レイヤの中身をすべて空に\n\t[iscript]\n\t$(\".layer_camera\").empty();\n\t$(\"#bgmovie\").remove();\n\t[endscript]\n\n;\tメニューボタン非表示\n\t[hidemenubutton]\n\n\t[iscript]\n\n\tTG.config.autoRecordLabel = \"true\"; // ラベル通過記録を有効に\n\n\ttf.current_bgm_vol = parseInt(TG.config.defaultBgmVolume); // BGM音量\n\ttf.current_se_vol = parseInt(TG.config.defaultSeVolume); // SE音量\n\t\n\ttf.current_ch_speed = parseInt(TG.config.chSpeed); // テキスト表示速度\n\ttf.current_auto_speed = parseInt(TG.config.autoSpeed); // オート時のテキスト表示速度\n\t\n\ttf.text_skip =\"ON\"; // 未読スキップ\n\tif(TG.config.unReadTextSkip != \"true\"){\n\t\ttf.text_skip =\"OFF\";\n\t}\n\n\ttf.user_setting = TG.config.alreadyReadTextColor;\n\tif(tf.user_setting != 'default'){\n\t\tTG.config.alreadyReadTextColor = 'default'; // 一時的に既読テキストの文字色を変更しないようにしています\n\t}\n\n\t[endscript]\n\n\t[iscript]\n\n\t/* 画像類のパス */\n\ttf.img_path = '../image/config/';\n\n\t/* 画像類のパス（ボタン） */\n\ttf.btn_path_off = tf.img_path + 'c_btn.gif';\n\ttf.btn_path_on  = tf.img_path + 'c_set.png';\n\n\t// ボタン画像の幅と高さ\n\ttf.btn_w  = 46; // 幅\n\ttf.btn_h = 46; // 高さ\n\n\t// ボタンを表示する座標（tf.config_y_ch[0]とtf.config_y_auto[0]は未使用）\n\ttf.config_x       = [1040, 400,　454, 508, 562, 616, 670, 724, 778, 832, 886]; // X座標（共通）\n\n\ttf.config_y_bgm   = 190; // BGMのY座標\n\ttf.config_y_se    = 250; // SEのY座標\n\ttf.config_y_ch    = 325; // テキスト速度のY座標\n\ttf.config_y_auto  = 385; // オート速度のY座標\n\n\t// 上記の配列変数の添字を格納しておく変数。選択した音量や速度に対応。\n\ttf.config_num_bgm;  // BGM\n\ttf.config_num_se;   // SE\n\ttf.config_num_ch;   // テキスト速度\n\ttf.config_num_auto; // オート速度\n\n\t// テキスト速度のサンプルテキストとして表示する文字列（お好みに合わせて変更してください）\n\ttf.text_sample = 'テストメッセージです。このスピードでテキストが表示されます。';\n\n\t// サンプルテキストを表示しておく時間（テキストを表示し終わってから700ミリ秒で消去させています）\n\ttf.text_sample_speed;\n\n\t// 既読スキップの画像ファイル名を格納しておく変数\n\ttf.img_unread_skip;\n\n\t[endscript]\n\n[cm]\n\n;\tコンフィグ用の背景を読み込んでトランジション\n\t[bg storage=\"&tf.img_path +'bg_config.png'\" time=\"100\"]\n\n;\t画面右上の「Back」ボタン\n\t[button fix=\"true\" graphic=\"&tf.img_path + 'c_btn_back.png'\" enterimg=\"&tf.img_path + 'c_btn_back2.png'\" target=\"*backtitle\" x=\"1160\" y=\"20\"]\n\n[jump target=\"*config_page\"]\n\n\n*config_page\n;------------------------------------------------------------------------------------------------------\n; BGM音量\n;------------------------------------------------------------------------------------------------------\n\t[button name=\"bgmvol,bgmvol_10\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[1]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  10; tf.config_num_bgm =  1\"]\n\t[button name=\"bgmvol,bgmvol_20\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[2]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  20; tf.config_num_bgm =  2\"]\n\t[button name=\"bgmvol,bgmvol_30\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[3]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  30; tf.config_num_bgm =  3\"]\n\t[button name=\"bgmvol,bgmvol_40\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[4]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  40; tf.config_num_bgm =  4\"]\n\t[button name=\"bgmvol,bgmvol_50\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[5]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  50; tf.config_num_bgm =  5\"]\n\t[button name=\"bgmvol,bgmvol_60\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[6]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  60; tf.config_num_bgm =  6\"]\n\t[button name=\"bgmvol,bgmvol_70\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[7]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  70; tf.config_num_bgm =  7\"]\n\t[button name=\"bgmvol,bgmvol_80\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[8]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  80; tf.config_num_bgm =  8\"]\n\t[button name=\"bgmvol,bgmvol_90\"  fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[9]\"  y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol =  90; tf.config_num_bgm =  9\"]\n\t[button name=\"bgmvol,bgmvol_100\" fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[10]\" y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol = 100; tf.config_num_bgm = 10\"]\n\n;\tBGMミュート\n\t[button name=\"bgmvol,bgmvol_0\"   fix=\"true\" target=\"*vol_bgm_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[0]\" y=\"&tf.config_y_bgm\" exp=\"tf.current_bgm_vol = 0; tf.config_num_bgm = 0\"]\n\n;------------------------------------------------------------------------------------------------------\n; SE音量\n;------------------------------------------------------------------------------------------------------\n\t[button name=\"sevol,sevol_10\"  fix=\"true\" target=\"*vol_se_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[1]\"  y=\"&tf.config_y_se\" exp=\"tf.current_se_vol =  10; tf.config_num_se =  1\"]\n\t[button name=\"sevol,sevol_20\"  fix=\"true\" target=\"*vol_se_change\" graphic=\"&tf.btn_path_off\" width=\"&tf.btn_w\" height=\"&tf.btn_h\" x=\"&tf.config_x[2]\"  y=\"&tf.config_y_se\" exp=\"tf.current_se_vol =  20; tf.config_num_se =  2\"]\n\t[button name=\"sevol,sevol_30\"  fix=\"true\" target=\"*vol_se_change\" graphic height=\"45\" x=\"580\" y=\"470\"]\n\n;------------------------------------------------------------------------------------------------------\n; コンフィグ起動時の画面更新\n;------------------------------------------------------------------------------------------------------\n\n\t[iscript]\n\n\t$(\".bgmvol_\"+tf.current_bgm_vol).attr(\"src\",\"data/image/config/c_set.png\");\n\n\t$(\".sevol_\"+tf.current_se_vol).attr(\"src\",\"data/image/config/c_set.png\");\n\n\t$(\".ch_\"+tf.current_ch_speed).attr(\"src\",\"data/image/config/c_set.png\");\n\n\t$(\".auto_\"+tf.current_auto_speed).attr(\"src\",\"data/image/config/c_set.png\");\n\n\tif(tf.text_skip == 'OFF'){\n\t\t$(\".unread_off\").attr(\"src\",\"./data/image/config/c_skipoff.png\");\n\t\t}else{\n\t\t\t$(\".unread_on\").attr(\"src\",\"./data/image/config/c_skipon.png\");\n\t\t\t}\n\t[endscript]\n\n[s]\n\n;--------------------------------------------------------------------------------\n; コンフィグモードの終了\n;--------------------------------------------------------------------------------\n*backtitle\n[cm]\n\n\t[iscript]\n\tTG.config.alreadyReadTextColor = tf.user_setting; // 既読テキストの文字色を復帰\n\t[endscript]\n\n;\tテキスト速度のサンプル表示に使用していたメッセージレイヤを非表示に\n\t[layopt layer=\"message1\" visible=\"false\"]\n\n;\tfixボタンをクリア\n\t[clearfix]\n\n;\tキーコンフィグの有効化\n\t[start_keyconfig]\n\n;\tコールスタックのクリア\n\t[clearstack]\n\n;\tゲーム復帰\n\t[awakegame]\n\n;================================================================================\n\n; ボタンクリック時の処理\n\n;================================================================================\n;--------------------------------------------------------------------------------\n; BGM音量\n;--------------------------------------------------------------------------------\n*vol_bgm_change\n\n[iscript]\n\t$(\".bgmvol\").attr(\"src\",\"data/image/config/c_btn.png\");\n\t$(\".bgmvol_\"+tf.current_bgm_vol).attr(\"src\",\"data/image/config/c_set.png\");\n[endscript]\n\n[bgmopt volume=\"&tf.current_bgm_vol\"]\n\n[return]\n\n;--------------------------------------------------------------------------------\n; SE音量\n;--------------------------------------------------------------------------------\n*vol_se_change\n\n[iscript]\n\t$(\".sevol\").attr(\"src\",\"data/image/config/c_btn.png\");\n\t$(\".sevol_\"+tf.current_se_vol).attr(\"src\",\"data/image/config/c_set.png\");\n[endscript]\n\n[seopt volume=\"&tf.current_se_vol\"]\n\n[return]\n\n;---------------------------------------------------------------------------------\n; テキスト速度\n;--------------------------------------------------------------------------------\n*ch_speed_change\n\n\t[iscript]\n\n\t$(\".ch\").attr(\"src\",\"data/image/config/c_btn.png\");\n\t$(\".ch_\"+tf.set_ch_speed).attr(\"src\",\"data/image/config/c_set.png\");\n\ttf.current_ch_speed = tf.set_ch_speed;\n\n\t[endscript]\n\n\t[configdelay speed=\"&tf.set_ch_speed\"]\n\n;\tテキスト表示速度のサンプルに使用するメッセージレイヤの設定\n\t[position layer=\"message1\" left=\"90\" top=\"580\" width=\"1100\" height=\"100\" margint=\"2\" marginl=\"30\" page=\"fore\" visible=\"true\" opacity=\"0\"]\n\t[layopt layer=\"message1\" visible=\"true\"]\n\t[current layer=\"message1\"]\n\n;\tサンプルテキストを表示する\n\t[emb exp=\"tf.text_sample\"]\n\n\t\t[iscript]\n\t\t$(\".current_span\").css(\"color\",\"#66564C\"); // サンプルテキストのフォントカラーを指定\n\t\ttf.system.backlog.pop(); // サンプルテキストを履歴から削除（nolog～endnologタグと同じです）\n\t\t[endscript]\n\n;\t待ち時間をテキスト速度とサンプルの文字数に対応（消えるのが早すぎるときは後ろの数字を好きなだけ増やそう）\n\t[eval exp=\"tf.text_sample_speed = tf.set_ch_speed * tf.text_sample.length + 700\"]\n\t[wait time=\"&tf.text_sample_speed\"]\n\n\t[er]\n\t[layopt layer=\"message1\" visible=\"false\"]\n\n[return]\n\n;--------------------------------------------------------------------------------\n; オート速度\n;--------------------------------------------------------------------------------\n*auto_speed_change\n\n\t[iscript]\n\n\t$(\".auto\").attr(\"src\",\"data/image/config/c_btn.png\");\n\t$(\".auto_\"+tf.set_auto_speed).attr(\"src\",\"data/image/config/c_set.png\");\n\n\t[endscript]\n\t[autoconfig speed=\"&tf.set_auto_speed\"]\n\n[return]\n\n;--------------------------------------------------------------------------------\n; スキップ処理-OFF\n;--------------------------------------------------------------------------------\n*skip_off\n\n\t[iscript]\n\t$(\".unread_off\").attr(\"src\",\"./data/image/config/c_skipoff.png\");\n\t$(\".unread_on\").attr(\"src\",\"./data/image/config/c_btn.gif\");\n\ttf.text_skip = \"OFF\";\n\t[endscript]\n\n\t[config_record_label skip=\"false\"]\n\n[return]\n\n;--------------------------------------------------------------------------------\n; スキップ処理-ON\n;--------------------------------------------------------------------------------\n*skip_on\n\n\t[iscript]\n\t$(\".unread_off\").attr(\"src\",\"./data/image/config/c_btn.gif\");\n\t$(\".unread_on\").attr(\"src\",\"./data/image/config/c_skipon.png\");\n\ttf.text_skip = \"ON\";\n\t[endscript]\n\n\t[config_record_label skip=\"true\"]\n\n[return]\n\n;================================================================================\n\n; サブルーチン\n\n;================================================================================\n;--------------------------------------------------------------------------------\n\n; BGM更新\n\n;--------------------------------------------------------------------------------\n*icon_bgm\n\n\t[iscript]\n\n\t// 設定した音量によって色付き画像の表示・非表示を切替える\n\n\t$( \".bgm_img_0\").css( \"visibility\", tf.config_num_bgm == 0 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_1\").css( \"visibility\", tf.config_num_bgm >  0 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_2\").css( \"visibility\", tf.config_num_bgm >  1 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_3\").css( \"visibility\", tf.config_num_bgm >  2 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_4\").css( \"visibility\", tf.config_num_bgm >  3 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_5\").css( \"visibility\", tf.config_num_bgm >  4 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_6\").css( \"visibility\", tf.config_num_bgm >  5 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_7\").css( \"visibility\", tf.config_num_bgm >  6 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_8\").css( \"visibility\", tf.config_num_bgm >  7 ? 'visible' : 'hidden' );\n\t$( \".bgm_img_9\").css( \"visibility\", tf.config_num_bgm >  8 ? 'visible' : 'hidden' );\n\t$(\".bgm_img_10\").css( \"visibility\", tf.config_num_bgm >  9 ? 'visible' : 'hidden' );\n\n\t[endscript]\n\n[return]\n\n;--------------------------------------------------------------------------------\n\n; SE更新\n\n;--------------------------------------------------------------------------------\n*icon_se\n\n\t[iscript]\n\n\t$(\".se_img_0\").css( \"visibility\", tf.config_num_se == 0 ? 'visible' : 'hidden');\n\t$(\".se_img_1\").css( \"visibility\", tf.config_num_se >  0 ? 'visible' : 'hidden');\n\t$(\".se_img_2\").css( \"visibility\", tf.config_num_se >  1 ? 'visible' : 'hidden');\n\t$(\".se_img_3\").css( \"visibility\", tf.config_num_se >  2 ? 'visible' : 'hidden');\n\t$(\".se_img_4\").css( \"visibility\", tf.config_num_se >  3 ? 'visible' : 'hidden');\n\t$(\".se_img_5\").css( \"visibility\", tf.config_num_se >  4 ? 'visible' : 'hidden');\n\t$(\".se_img_6\").css( \"visibility\", tf.config_num_se >  5 ? 'visible' : 'hidden');\n\t$(\".se_img_7\").css( \"visibility\", tf.config_num_se >  6 ? 'visible' : 'hidden');\n\t$(\".se_img_8\").css( \"visibility\", tf.config_num_se >  7 ? 'visible' : 'hidden');\n\t$(\".se_img_9\").css( \"visibility\", tf.config_num_se >  8 ? 'visible' : 'hidden');\n\t$(\".se_img_10\").css(\"visibility\", tf.config_num_se >  9 ? 'visible' : 'hidden');\n\n\t[endscript]\n\n[return]\n\n;--------------------------------------------------------------------------------\n\n; テキスト速度更新\n\n;--------------------------------------------------------------------------------\n*icon_ch\n\n\t[iscript]\n\n\t$(\".ch_img_1\").css( \"visibility\", tf.config_num_ch >= 0 ? 'visible' : 'hidden');\n\t$(\".ch_img_2\").css( \"visibility\", tf.config_num_ch >  0 ? 'visible' : 'hidden');\n\t$(\".ch_img_3\").css( \"visibility\", tf.config_num_ch >  1 ? 'visible' : 'hidden');\n\t$(\".ch_img_4\").css( \"visibility\", tf.config_num_ch >  2 ? 'visible' : 'hidden');\n\t$(\".ch_img_5\").css( \"visibility\", tf.config_num_ch >  3 ? 'visible' : 'hidden');\n\t$(\".ch_img_6\").css( \"visibility\", tf.config_num_ch >  4 ? 'visible' : 'hidden');\n\t$(\".ch_img_7\").css( \"visibility\", tf.config_num_ch >  5 ? 'visible' : 'hidden');\n\t$(\".ch_img_8\").css( \"visibility\", tf.config_num_ch >  6 ? 'visible' : 'hidden');\n\t$(\".ch_img_9\").css( \"visibility\", tf.config_num_ch >  7 ? 'visible' : 'hidden');\n\t$(\".ch_img_10\").css(\"visibility\", tf.config_num_ch >  8 ? 'visible' : 'hidden');\n\n\t[endscript]\n\n[return]\n\n;--------------------------------------------------------------------------------\n\n; オート速度更新\n\n;--------------------------------------------------------------------------------\n*icon_auto\n\n\t[iscript]\n\n\t$(\".auto_img_1\").css( \"visibility\", tf.config_num_auto >= 0 ? 'visible' : 'hidden');\n\t$(\".auto_img_2\").css( \"visibility\", tf.config_num_auto >  0 ? 'visible' : 'hidden');\n\t$(\".auto_img_3\").css( \"visibility\", tf.config_num_auto >  1 ? 'visible' : 'hidden');\n\t$(\".auto_img_4\").css( \"visibility\", tf.config_num_auto >  2 ? 'visible' : 'hidden');\n\t$(\".auto_img_5\").css( \"visibility\", tf.config_num_auto >  3 ? 'visible' : 'hidden');\n\t$(\".auto_img_6\").css( \"visibility\", tf.config_num_auto >  4 ? 'visible' : 'hidden');\n\t$(\".auto_img_7\").css( \"visibility\", tf.config_num_auto >  5 ? 'visible' : 'hidden');\n\t$(\".auto_img_8\").css( \"visibility\", tf.config_num_auto >  6 ? 'visible' : 'hidden');\n\t$(\".auto_img_9\").css( \"visibility\", tf.config_num_auto >  7 ? 'visible' : 'hidden');\n\t$(\".auto_img_10\").css(\"visibility\", tf.config_num_auto >  8 ? 'visible' : 'hidden');\n\n\t[endscript]\n\n[return]\n\n;================================================================================\n\n; 画像の読 me=\"ch_img_9\"  storage=\"&tf.img_path + 'set1.png'\" x=\"&tf.config_x[9]\"  y=\"&tf.config_y_ch\"]\n\t[image layer=\"0\" name=\"ch_img_10\" storage=\"&tf.img_path + 'set1.png'\" x=\"&tf.config_x[10]\" y=\"&tf.config_y_ch\"]\n\n;\tオート速度\n\t[image layer=\"0\" name=\"auto_img_1\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[1]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_2\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[2]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_3\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[3]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_4\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[4]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_5\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[5]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_6\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[6]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_7\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[7]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_8\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[8]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_9\"  storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[9]\"  y=\"&tf.config_y_auto\"]\n\t[image layer=\"0\" name=\"auto_img_10\" storage=\"&tf.img_path + 'set2.png'\"  x=\"&tf.config_x[10]\" y=\"&tf.config_y_auto\"]\n\n[return]\n", "data/scenario/first.ks": ";《空中圣阁》完整演出入口\n[stop_keyconfig]\n@call storage=\"tyrano.ks\"\n@jump storage=\"空中圣阁_完整演出.ks\"\n[s]\n", "data/scenario/make.ks": ";このファイルは削除しないでください！\n;\n;make.ks はデータをロードした時に呼ばれる特別なKSファイルです。\n;Fixレイヤーの初期化など、ロード時点で再構築したい処理をこちらに記述してください。\n;\n;\n\n;make.ks はロード時にcallとして呼ばれるため、return必須です。\n[return]\n\n", "data/scenario/replay.ks": ";=========================================\n; 回想モード　画面作成\n;=========================================\n*start\n@layopt layer=message0 visible=false\n@clearfix\n[hidemenubutton]\n[cm]\n\n\n[bg storage=\"../../tyrano/images/system/bg_base.png\" time=100]\n[layopt layer=1 visible=true]\n\n[image name=\"label_replay\" layer=1 left=0 top=0 storage=\"config/label_recollection.png\" folder=\"image\" ]\n\n[iscript]\n    \n    tf.page = 0;\n    tf.selected_replay_obj = \"\"; //選択されたリプレイを一時的に保管\n    \n[endscript]\n\n\n\n*replaypage\n[cm]\n[button graphic=\"config/menu_button_close.png\" enterimg=\"config/menu_button_close2.png\"  target=\"*backtitle\" x=1150 y=40 ]\n\n[iscript]\n\ttf.target_page = \"page_\"+tf.page;\n[endscript]\n\n*replayview\n\n@jump target=&tf.target_page\n\n*page_0\n[replay_image_button name=\"replay1\" graphic=\"cat.jpg\" no_graphic=\"../../tyrano/images/system/noimage.png\" x=60 y=130 width=160 height=140 folder=\"bgimage\" ]\n[replay_image_button name=\"replay2\" graphic=\"toile.jpg\" no_graphic=\"../../tyrano/images/system/noimage.png\" x=260 y=130 width=160 height=140 folder=\"bgimage\" ]\n\n\n@jump target =\"*common\"\n\n\n*common\n\n[s]\n\n*backtitle\n[cm]\n[freeimage layer=1]\n\n[iscript]\ntf.system.flag_replay = false;\n[endscript]\n\n@jump storage=title.ks\n\n*nextpage\n[emb exp=\"tf.page++;\"]\n@jump target=\"*replaypage\"\n\n\n*backpage\n[emb exp=\"tf.page--;\"]\n@jump target=\"*replaypage\"\n\n*clickcg\n[cm]\n\n[iscript]\n    tf.system.flag_replay = true;\n[endscript]\n\n[free layer=1 name=\"label_replay\"]\n\n@jump storage=&tf.selected_replay_obj.storage target=&tf.selected_replay_obj.target\n[s]\n\n*no_image\n\n@jump  target=*replaypage\n\n\n", "data/scenario/scene1.ks": ";ティラノスクリプトサンプルゲーム\n\n*start\n\n[cm  ]\n[clearfix]\n[start_keyconfig]\n\n\n[bg storage=\"room.jpg\" time=\"100\"]\n\n;メニューボタンの表示\n@showmenubutton\n\n;メッセージウィンドウの設定\n[position layer=\"message0\" left=160 top=500 width=1000 height=200 page=fore visible=true]\n\n;文字が表示される領域を調整\n[position layer=message0 page=fore margint=\"45\" marginl=\"50\" marginr=\"70\" marginb=\"60\"]\n\n\n;メッセージウィンドウの表示\n@layopt layer=message0 visible=true\n\n;キャラクターの名前が表示される文字領域\n[ptext name=\"chara_name_area\" layer=\"message0\" color=\"white\" size=28 bold=true x=180 y=510]\n\n;上記で定義した領域がキャラクターの名前表示であることを宣言（これがないと#の部分でエラーになります）\n[chara_config ptext=\"chara_name_area\"]\n\n;このゲームで登場するキャラクターを宣言\n;akane\n[chara_new  name=\"akane\" storage=\"chara/akane/normal.png\" jname=\"あかね\"  ]\n;キャラクターの表情登録\n[chara_face name=\"akane\" face=\"angry\" storage=\"chara/akane/angry.png\"]\n[chara_face name=\"akane\" face=\"doki\" storage=\"chara/akane/doki.png\"]\n[chara_face name=\"akane\" face=\"happy\" storage=\"chara/akane/happy.png\"]\n[chara_face name=\"akane\" face=\"sad\" storage=\"chara/akane/sad.png\"]\n\n\n;yamato\n[chara_new  name=\"yamato\"  storage=\"chara/yamato/normal.png\" jname=\"やまと\" ]\n\n#\nさて、ゲームが簡単に作れるというから、来てみたものの[p]\n\n誰もいねぇじゃねぇか。[p]\n……[p]\n帰るか。。。[p]\n\n[font  size=\"30\"   ]\n#?\nちょっとまったーーーーー[p]\n[resetfont  ]\n\n#\n誰だ！？[p]\n\n;キャラクター登場\n[chara_show  name=\"akane\"  ]\n#?\nこんにちは。[p]\n私の名前はあかね。[p]\n#あかね\nもしかして、ノベルゲームの開発に興味があるの？[p]\n\n[glink  color=\"blue\"  storage=\"scene1.ks\"  size=\"28\"  x=\"360\"  width=\"500\"  y=\"150\"  text=\"はい。興味あります\"  target=\"*selectinterest\"  ]\n[glink  color=\"blue\"  storage=\"scene1.ks\"  size=\"28\"  x=\"360\"  width=\"500\"  y=\"250\"  text=\"興味あります！\"  target=\"*selectinterest\"  ]\n[glink  color=\"blue\"  storage=\"scene1.ks\"  size=\"28\"  x=\"360\"  width=\"500\"  y=\"350\"  text=\"どちらかと言うと興味あり\"  target=\"*selectinterest\"  ]\n[s  ]\n*selectinterest\n\n[chara_mod  name=\"akane\" face=\"happy\"  ]\n#あかね\nわー。興味あるなんて、嬉しいなー。[p]\n#\n・・・・・[p]\nまぁ、作ってみたい気持ちはあるけど、むずかしいんでしょ？[p]\nプログラミングとかやったことないし、、、[p]\n\n[chara_mod name=\"akane\" face=\"default\"]\n\n#あかね\nそんな君に、耳寄りな情報があるんだけど[p]\nききたい？　ききたいよね？[p]\n#\nいや、べつに\n#あかね\n[cm]\n[font size=40]\n[delay speed=160]\nティラノスクリプトー[p]\n[delay speed=30]\n[resetfont]\n\n#\n・・・・[p]\n#あかね\nティラノスクリプトを使うと、簡単に本格的なノベルゲームが簡単に作れてしまうのよ。[p]\n#\nへぇー。それはちょっと興味あるね。[p]\n\n[chara_mod  name=\"akane\" face=\"happy\"  ]\n#あかね\nほ、ほんと！？[p]\nこのゲームをプレイするだけで、ティラノスクリプトの機能を確認することができるから[p]\nぜひ、最後までつきあってね[p]\n\nまず、ティラノスクリプトの特徴として[font color=\"red\"]「HTML5」[resetfont]で動作するよ[p]\n\n\n#\nつ、つまり？[p]\n#あかね\n一度ティラノスクリプトで作ったゲームは多くの環境で動作させることができるってこと！[p]\n#\nへぇー。それはいいね。[p]\nせっかく作ったらたくさんの人に遊んでもらいたいもんね。[p]\n\n#あかね\nウィンドウズ用のPCアプリケーションはもちろん。[p]\nマック用のアプリケーションにだって対応するわよ。[p]\nあと、HTML5だから、ブラウザゲームとしても発表できるわよ。[p]\nウェブサイトに貼り付けて遊んでもらえるから、気軽にゲームをプレイしてもらうことができるね。[p]\n主要なブラウザはすべてサポートしているから、安心してね。[p]\n#\nやるなぁ。。[p]\n\nでも、最近スマホが復旧してて、僕のサイトにもスマホで訪れる人が増えたんだけど[p]\nスマホからは遊べない？[p]\n\n#あかね\nティラノスクリプトで作ったゲームはスマートフォンからでも遊べるよ！[p]\nアイフォーン、アンドロイドはもちろん。アイパッドとかのタブレットでも問題ないわ。[p]\n#\nおぉー。[p]\n\n#あかね\nAppStoreやGooglePlayに向けてアプリ化して販売することもできるから[p]\n#\nおぉぉ、、やっとの貧困生活から脱出できるかも[p]\n#あかね\nまぁ、おもしろいゲームつくらないと、売れもしないけどな！[p]\n#\nくっ。。[p]\n\n#あかね\nじゃあ、次に場面を移動してみるね[p]\n廊下に移動するよ[p]\n[bg  time=\"3000\"  method=\"crossfade\" storage=\"rouka.jpg\"  ]\n\n#\nお、廊下に移動したね。[p]\n\n#あかね\n寒いよぉ〜。はやく教室に戻ろう。[p]\n\n[bg  time=\"1000\" method=\"slide\"  storage=\"room.jpg\" ]\n#\nあれ、今、場面の移動がちょっと違ったね。[p]\n#あかね\nうん。急いでたからね。[p]\nティラノスクリプトでは、いろいろな演出を加える事ができて[p]\n画面を切り替えるだけでも１０種類以上の演出がつかえるよ。[p]\n#\nふむ。便利だ[p]\n\n#あかね\n次にメッセージの表示方法を変えてみるね[p]\nティラノスクリプトでは、今みたいなアドベンチャーゲームの他に[r]\nビジュアルノベルのような全画面表示のゲームもつくれるよ。[p]\n\n#\n\n;キャラクター非表示\n[chara_hide name=\"akane\"]\n\n\n;メッセージを全画面に切り替え\n[position layer=\"message0\" left=20 top=40 width=1200 height=660 page=fore visible=true ]\n\nどうかな? 物語をじっくり読ませたい場合はこの方式が便利ですね[l][r]\nティラノスクリプトは非常に強力で、柔軟な表現が可能です。[l][cm]\n\n[font size=40]文字のサイズを変更したり\n[l][r]\n[resetfont]\n[font color=\"pink\"]色を変更したり\n[resetfont][l][r]\n\n[ruby text=る]ル[ruby text=び]ビを[ruby text=ふ]振ることだって[ruby text=かん]簡[ruby text=たん]単にできます[l]\n[cm]\n\n;たて書きにする\n[position vertical=true layer=message0 page=fore margint=\"45\" marginl=\"0\" marginr=\"70\" marginb=\"60\"]\n\nこのように縦書きで記述することもできます。[r][l]\n縦書きでも、横書きの時と同じ機能を使うことができます。[r][l]\n\n;横書きに戻す\n[position vertical=false]\n\n横書きと縦書きをシーンによって使い分けることもできます[r][l]\nじゃあ、アドベンチャー形式に戻しますね[p]\n\n;メッセージボックスを元に戻す\n[position layer=\"message0\" left=160 top=500 width=1000 height=200 page=fore visible=true]\n\n@chara_show name=\"akane\"\n\n#akane\nメッセージボックスは、自分の好きな画像を使うこともできるよ[p]\n\n\n\n[font color=\"0x454D51\"]\n[deffont color=\"0x454D51\"]\n\n\n;名前部分のメッセージレイヤ削除\n[free name=\"chara_name_area\" layer=\"message0\"]\n\n;メッセージウィンドウの設定\n[position layer=\"message0\" width=\"1280\" height=\"210\" top=\"510\" left=\"0\"]\n[position layer=\"message0\" frame=\"frame.png\" margint=\"50\" marginl=\"100\" marginr=\"100\" opacity=\"230\" page=\"fore\"]\n\n;名前枠の設定\n[ptext name=\"chara_name_area\" layer=\"message0\" color=\"0xFAFAFA\" size=\"28\" bold=\"true\" x=\"100\" y=\"514\"]\n[chara_config ptext=\"chara_name_area\"]\n\n\n\nどうかな？[p]\nゲームに合わせて自分の好きなデザインを作ってくださいね[p]\n\nあと、デフォルトだとセーブやロードは画面右下のボタンからできるけど[p]\nウィンドウをカスタマイズすれば、、、、[p]\n\n;メニューボタン非表示\n@hidemenubutton\n\n;ロールボタン追加;;;;;;;;;;;;;;\n\n\n; ロールボタン配置\n\n;クイックセーブボタン\n[button name=\"role_button\" role=\"quicksave\" graphic=\"button/qsave.png\" enterimg=\"button/qsave2.png\" x=\"40\" y=\"690\"]\n\n;クイックロードボタン\n[button name=\"role_button\" role=\"quickload\" graphic=\"button/qload.png\" enterimg=\"button/qload2.png\" x=\"140\" y=\"690\"]\n\n;セーブボタン\n[button name=\"role_button\" role=\"save\" graphic=\"button/save.png\" enterimg=\"button/save2.png\" x=\"240\" y=\"690\"]\n\n;ロードボタン\n[button name=\"role_button\" role=\"load\" graphic=\"button/load.png\" enterimg=\"button/load2.png\" x=\"340\" y=\"690\"]\n\n;オートボタン\n[button name=\"role_button\" role=\"auto\" graphic=\"button/auto.png\" enterimg=\"button/auto2.png\" x=\"440\" y=\"690\"]\n\n;スキップボタン\n[button name=\"role_button\" role=\"skip\" graphic=\"button/skip.png\" enterimg=\"button/skip2.png\" x=\"540\" y=\"690\"]\n\n;バックログボタン\n[button name=\"role_button\" role=\"backlog\" graphic=\"button/log.png\" enterimg=\"button/log2.png\" x=\"640\" y=\"690\"]\n\n;フルスクリーン切替ボタン\n[button name=\"role_button\" role=\"fullscreen\" graphic=\"button/screen.png\" enterimg=\"button/screen2.png\" x=\"740\" y=\"690\"]\n\n;コンフィグボタン（※sleepgame を使用して config.ks を呼び出しています）\n[button name=\"role_button\" role=\"sleepgame\" graphic=\"button/sleep.png\" enterimg=\"button/sleep2.png\" storage=\"config.ks\" x=\"840\" y=\"690\"]\n\n;メニュー呼び出しボタン（※ロールボタンを使うなら不要）\n[button name=\"role_button\" role=\"menu\" graphic=\"button/menu.png\" enterimg=\"button/menu2.png\" x=\"940\" y=\"690\"]\n\n;メッセージウィンドウ非表示ボタン\n[button name=\"role_button\" role=\"window\" graphic=\"button/close.png\" enterimg=\"button/close2.png\" x=\"1040\" y=\"690\"]\n\n;タイトルに戻るボタン\n[button name=\"role_button\" role=\"title\" graphic=\"button/title.png\" enterimg=\"button/title2.png\" x=\"1140\" y=\"690\"]\n\n;;ロールボタン追加終わり\n\n\nこんな風にゲームに必要な機能を画面の上に持たせることも簡単にできるよ[p]\nこれはロールボタンといって、ボタンに特別な機能を持たせる事ができます。[p]\n標準で用意されているのは、[l]\nセーブ、[l]\nロード、[l][cm]\nタイトルへ戻る、\nメニュー表示、\nメッセージ非表示、\nスキップ、\nバックログ、\nフルスクリーン切り替え、\nクイックセーブ、\nクイックロード、\nオートモード！\n[p]\n\nはぁ、はぁ[p]\n\n#\n大丈夫？[p]\nこれだけあれば、ゲームを作るには困らなそうだね[p]\n\n#あかね\nさて、もちろん音楽を鳴らすこともできるよ[l][cm]\nそれじゃあ、再生するよ？[l][cm]\n\n[link target=*playmusic]【１】うん。再生してください[endlink][r]\n[link target=*noplay]【２】いや。今は再生しないで！[endlink]\n[s]\n\n*playmusic\n\n[cm]\nよし、再生するよ。[l]\n@playbgm time=\"3000\" storage=music.ogg loop=true\n徐々にフェードインしながら再生することもできるんだ[l][cm]\n\n@jump target=\"*common_bgm\"\n\n*noplay\n[cm]\nうん。わかった。再生はしないね。[l][cm]\nまた、試してみてね[l][cm]\n\n*common_bgm\n\nあ、そうそう[l][cm]\n今みたいな選択肢で物語を分岐することも、簡単にできるよ。[l][cm]\n\n#あかね\nここらで、別のキャラクターに登場してもらいましょうか[l][cm]\nやまとー[p]\n[chara_show name=\"yamato\"]\n\nこんな風に。簡単です。[l][r]\nキャラクターは何人でも登場させることができるから、試してみてね。[p]\n\n#yamato\nおい、俺もう、帰っていいかな？[l][cm]\n\n#akane\nあ、ごめんごめん。ありがとう[l][cm]\n\n[chara_hide name=\"yamato\"]\n\n#akane\nこれでティラノスクリプトの基本機能の説明は終わりだけど[p]\nどうだったかな？[p]\n\n#\nうん、これなら自分でも作れそうな気がしてきたよ[p]\n\n#あかね\nよかった！[p]\n最初は、ティラノスクリプト公式ページのチュートリアルをやってみると良いと思うよ！[p]\nもちろん、このゲームもティラノスクリプトで動いてるから、参考になると思うし。[p]\nぜひ、ゲーム制作にチャレンジしてみてね[p]\nプレイしてくれてありがとう。[p]\n\n最後にティラノスクリプトで役立つ情報へのリンクを表示しておくから\n確認してみてね。[p]\n\n[cm]\n\n*button_link\n\n@layopt layer=message0 visible=false\n@layopt layer=fix visible=false\n[anim name=\"akane\" left=600 time=1000]\n\n;リンクボタンを表示\n[glink text=\"ティラノビルダーの紹介\" size=20 width=500 x=30 y=100 color=blue target=tyranobuilder ]\n[glink text=\"制作事例\" size=20 width=500 x=30 y=160 color=blue target=example ]\n[glink text=\"応用テクニック\" size=20 width=500 x=30 y=220 color=blue target=tech ]\n[glink text=\"役に立つ情報源\" size=20 width=500 x=30 y=280 color=blue target=info ]\n[glink text=\"タグリファレンス\" size=20 width=500 x=30 y=340 color=blue target=tagref ]\n\n[s]\n\n*tyranobuilder\n\n[cm]\n@layopt layer=message0 visible=true\n@layopt layer=fix visible=true;\n[font color-\"red\"]\n「ティラノビルダー」\n[resetfont]\nという無料の開発ツールもあります。[p]\n\n[image layer=1 page=fore visible=true top=10 left=50 width=560 height=400  storage = builder.png]\n\nこれは、グラフィカルな画面でノベルゲームを作れるツールです[p]\nスクリプトが苦手な人でもゲーム制作を行うことができるからぜひ試してね。[p]\n[freeimage layer=1]\n\n@jump target=button_link\n\n[s]\n*example\n@layopt layer=message0 visible=true\n@layopt layer=fix visible=true\nこれまで、ティラノスクリプトを使って沢山のゲームが作成されています。[p]\n一部の制作事例を公式サイトに乗せているのでよければ確認してくださいね。[p]\n\n[iscript]\nwindow.open(\"http://tyrano.jp/home/example\");\n[endscript]\n\n@jump target=button_link\n\n[cm]\n[s]\n\n*tech\n@layopt layer=message0 visible=true\n@layopt layer=fix visible=true\nこのサンプルでは、ティラノスクリプトのごく一部の機能しか紹介できていません[p]\nさらに出来ることを知りたい場合、スクリプトを丸ごとダウンロードできるようになっているので[p]\nそのサンプルを触ってみることをオススメします！[p]\n\n[iscript]\nwindow.open(\"http://tyrano.jp/home/demo\");\n[endscript]\n\n@jump target=button_link\n\n\n*info\n@layopt layer=message0 visible=true\n@layopt layer=fix visible=true\nティラノスクリプトでわからないことがあったら[p]\n公式掲示板で質問したり、Wikiなどもありますので参考にしてみてください[p]\n@jump target=button_link\n\n*tagref\n@layopt layer=message0 visible=true\n@layopt layer=fix visible=true\nタグは詳細なリファレンスページが用意されています。[p]\nこのページでさらに詳細な使い方を身につけてください[p]\n\n[iscript]\nwindow.open(\"http://tyrano.jp/home/tag\");\n[endscript]\n\n@jump target=\"*button_link\"\n\n[s]", "data/scenario/title.ks": "\n[cm]\n\n@clearstack\n@bg storage =\"title.jpg\" time=100\n@wait time = 200\n\n*start \n\n[button x=135 y=230 graphic=\"title/button_start.png\" enterimg=\"title/button_start2.png\"  target=\"gamestart\" keyfocus=\"1\"]\n[button x=135 y=320 graphic=\"title/button_load.png\" enterimg=\"title/button_load2.png\" role=\"load\" keyfocus=\"2\"]\n[button x=135 y=410 graphic=\"title/button_cg.png\" enterimg=\"title/button_cg2.png\" storage=\"cg.ks\" keyfocus=\"3\"]\n[button x=135 y=500 graphic=\"title/button_replay.png\" enterimg=\"title/button_replay2.png\" storage=\"replay.ks\" keyfocus=\"4\"]\n[button x=135 y=590 graphic=\"title/button_config.png\" enterimg=\"title/button_config2.png\" role=\"sleepgame\" storage=\"config.ks\" keyfocus=\"5\"]\n\n[s]\n\n*gamestart\n;一番最初のシナリオファイルへジャンプする\n@jump storage=\"scene1.ks\"\n\n\n\n", "data/scenario/tyrano.ks": "\n*start\n\n;背景変更マクロ　storage と time を指定する\n[macro name=\"back\"]\n\n;@layopt layer=message0 visible=false\n[backlay]\n[image layer=base page=back storage=%storage]\n[trans layer=\"base\" method=%method|crossfade children=false time=%time|2000]\n[wt]\n;@layopt layer=message0 visible=true\n\n[endmacro]\n\n\n;キャラクターを表示、そして設定\n[macro name=\"charaset\"]\n\n[backlay]\n[image storage=%storage left=%left|0 top=%top|0 layer=%layer page=back visible=true  ]\n[trans time=%time|1]\n@wt\n\n[endmacro]\n\n[macro name=\"chararemove\"]\n\n[freeimage layer = %layer]\n\n[endmacro]\n\n;;;;;;;;;;;;セーブ関係\n\n;save情報を取得、ptextを継承する\n\n[macro name=\"saveinfo\"]\n\n[iscript]\n\ntf.savetext = \"\";\n\ntf.array_save = TG.menu.getSaveData().data;\ntf.data = tf.array_save[mp.index];\n\ntf.title = tf.data.title;\ntf.save_date = tf.data.save_date;\n\ntf.savetext = \"<span style='font-size:10px'>\"+tf.save_date+\"</span><br />\"+tf.title;\n\n[endscript]\n\n[ptext * text=&tf.savetext ]\n\n\n[endmacro]\n\n[macro name=\"setsave\"]\n\n    [iscript]\n\n        TG.menu.doSave(mp.index);\n        \n    [endscript]\n\n[endmacro]\n\n[macro name=\"loading\"]\n\n    [iscript]\n\n        TG.menu.loadGame(mp.index);\n\n    [endscript]\n\n[endmacro]\n\n\n;/////////////拡張 CGモードなどを利用するための設定\n\n[iscript]\n\t\n\tif(sf.cg_view){\n    }else{\n    \tsf.cg_view = {};\n    }\n\t\n\tif(sf.replay_view){\n    }else{\n    \tsf.replay_view = {};\n    }\n\t\n\t\n[endscript]\n\n\n;CGモードのボタンを表示するためのマクロ\n[macro name=\"cg_image_button\"]\n\t\n\t[iscript]\n\t\t\n\t\tmp.graphic = mp.graphic.split(',');\n\t\tmp.tmp_graphic = mp.graphic.concat();\n\t\ttf.is_cg_open = false;\n\t\tif(sf.cg_view[mp.graphic[0]]){\n\t\t\ttf.is_cg_open = true;\n\t\t}\n\t\t\n        if(typeof mp.thumb !=\"undefined\"){\n            mp.tmp_graphic[0] = mp.thumb;\n        }\n\t\n\t\n\t[endscript]\n\t\n\t;渡された値を元に、CG状態を確認していく\n\t[if exp=\"tf.is_cg_open==true\"]\n\t\t[button graphic=&mp.tmp_graphic[0] x=&mp.x y=&mp.y width=&mp.width height=&mp.height preexp=\"mp.graphic\" exp=\"tf.selected_cg_image = preexp\" storage=\"cg.ks\" target=\"*clickcg\" folder=\"bgimage\" ]\n\t[else]\n\t\t[button graphic=&mp.no_graphic x=&mp.x y=&mp.y width=&mp.width height=&mp.height storage=\"cg.ks\" target=\"*no_image\" folder=\"bgimage\" ]\n\t[endif]\n[endmacro]\n\n;CGが閲覧された場合、CGモードで表示できるようにする\n[macro name=\"cg\" ]\n\n    [iscript]\n\n        sf.cg_view[mp.storage] = \"on\";\n    \n    [endscript]\n\n[endmacro]\n\n\n;リプレイモード\n;CGモードのボタンを表示するためのマクロ\n[macro name=\"replay_image_button\"]\n\t\n\t[iscript]\n\t\t\n\t\ttf.is_replay_open = false;\n\t\tif(sf.replay_view[mp.name]){\n\t\t\ttf.is_replay_open = true;\n\t\t}\n\t\n\t[endscript]\n\t\n\t;渡された値を元に、CG状態を確認していく\n\t[if exp=\"tf.is_replay_open==true\"]\n\t\t[button graphic=&mp.graphic x=&mp.x y=&mp.y width=&mp.width height=&mp.height preexp=\"sf.replay_view[mp.name]\" exp=\"tf.selected_replay_obj = preexp\" storage=\"replay.ks\" target=\"*clickcg\" folder=\"bgimage\" ]\n\t[else]\n\t\t[button graphic=&mp.no_graphic x=&mp.x y=&mp.y width=&mp.width height=&mp.height storage=\"replay.ks\" target=\"*no_image\" folder=\"bgimage\" ]\n\t[endif]\n\t\n[endmacro]\n\n;リプレイを開放する\n[macro name=\"setreplay\" ]\n\n    [iscript]\n\n        sf.replay_view[mp.name] = {storage:mp.storage, target:mp.target};\n    \n    [endscript]\n\n[endmacro]\n\n[macro name=\"endreplay\"]\n\n    [if exp=\"tf.system.flag_replay == true\"]\n        \n        @layopt page=\"fore\" layer=\"message0\" visible=false\n        ;システムボタンを非表示にするなど\n        [hidemenubutton]\n        \n        @jump storage=\"replay.ks\" \n        \n    [endif]\n\n[endmacro]\n\n[return]\n\n\n", "data/scenario/空中圣阁_完整演出.ks": "; ========================================\n; 《空中圣阁》完整演出脚本\n; 自动生成版本：1.0\n; 原文事件：459\n; 场次：12\n; 本文件不包含尚未生成的配音和 BGM\n; ========================================\n\n*start\n[stop_keyconfig]\n[cm]\n[clearfix]\n\n; 自动播放\n[autostart]\n\n; 16:9 对话框\n[position layer=\"message0\" left=80 top=790 width=1760 height=230 page=fore visible=true]\n[position layer=\"message0\" page=fore margint=\"35\" marginl=\"55\" marginr=\"55\" marginb=\"35\"]\n[layopt layer=\"message0\" visible=true]\n[ptext name=\"chara_name_area\" layer=\"message0\" color=\"0xFFFFFF\" size=30 bold=true x=125 y=795]\n[chara_config ptext=\"chara_name_area\"]\n\n; 注册正式人物素材\n[chara_new name=\"yuqianxun\" storage=\"characters_final/余千询.png\" jname=\"余千询\" width=\"439\" height=\"780\"]\n[chara_new name=\"wananhui\" storage=\"characters_final/宛暗慧.png\" jname=\"宛暗慧\" width=\"556\" height=\"780\"]\n[chara_new name=\"zhilemei\" storage=\"characters_final/智乐美.png\" jname=\"智乐美\" width=\"439\" height=\"780\"]\n[chara_new name=\"jimo\" storage=\"characters_final/极墨.png\" jname=\"极墨\" width=\"439\" height=\"780\"]\n[chara_new name=\"dengxu\" storage=\"characters_final/灯墟.png\" jname=\"灯墟\" width=\"439\" height=\"780\"]\n[chara_new name=\"huishu\" storage=\"characters_final/灰数.png\" jname=\"灰数\" width=\"520\" height=\"780\"]\n[chara_new name=\"kuangsui\" storage=\"characters_final/狂燧.png\" jname=\"狂燧\" width=\"439\" height=\"780\"]\n[chara_new name=\"weizhansi\" storage=\"characters_final/蔚湛思.png\" jname=\"蔚湛思\" width=\"552\" height=\"780\"]\n\n; 正式演出开始\n\n\n; 原文第 29 行 | location\n[cm]\n[bg storage=\"圣阁外部.png\" time=1400 method=\"crossfade\"]\n#第1场\n通天神谕\n[l]\n[bg storage=\"东环空轨.png\" time=1200 method=\"crossfade\"]\n#地点\n雾港市·空中圣阁外廊与东环空轨站\n[l]\n\n; 原文第 30 行 | time\n#时间\n秋末的雨夜\n[l]\n\n; 原文第 31 行 | entrance\n#登场人物\n灰数、灯墟、极墨、圣光合唱团、市民甲\n[l]\n\n; 原文第 32 行 | stage_direction\n[cm]\n#舞台说明\n舞台分为三个层次。最下层是雨水淋湿的空轨站台，电子站牌不断闪烁；中层是空中圣阁的玻璃外廊，透明管线将紫色魔晶送往高处；最高层为主教控制台，四道升力环的影子投在穹顶。远处列车缓慢驶过楼宇之间。圣阁的巨幅价目屏悬在半空，穿着一身圣衣的灰数站在最高层，计费魔杖连接着阀门轮盘。极墨在中层脚手架上调试着四重光束。灯墟双手被符文铁锁固定在人群中心的圣光对齐柱上。圣光合唱团戴着无面像素面具，按顺序将魔晶投入透明的管道。\n[p]\n\n; 原文第 33 行 | dialogue\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（轻轻转动魔杖，清了清嗓子）\n[p]\n[cm]\n#灰数\n诸位信徒，请听我说！普天之下，凡可被计算之物，皆应归于主的黑盒。你们若要祈求全知全能的神谕，就必须奉上你们的魔晶。想要与神对话，便请走上前来！\n[p]\n\n; 原文第 34 行 | chorus\n[chara_hide name=\"huishu\" time=500]\n#圣光合唱团\n（齐声合唱）献上魔晶！洗除原罪！敬我们挚爱的至高天！\n[p]\n\n; 原文第 35 行 | dialogue\n[cm]\n#动作\n（伤心地走到台前，手中拿着一张旧车票和一沓褪色文件）\n[p]\n[cm]\n#市民甲\n尊敬的识物主啊，请救救我！我只想知道东环空轨事故之前，最后一次检修究竟是什么时候！我父亲在那趟列车上丧生，事后只留下了一只表和一张车票。官方公告说事故原因是风压异常，可市政记录的日期与承运公司的公告对不上。我苦苦追查了三年，仍不知道该相信哪一份。我只想要一个真相！主啊，请为你的信徒主持公正吧！\n[p]\n\n; 原文第 36 行 | dialogue\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（装作一副为难的样子，啧了几声）\n[p]\n[cm]\n#灰数\n哎呀呀，可怜的信徒啊，这可不好办，识物主不一定会为你这种带有争议性的问题提供答案。话说你已经为这件事花了多少钱？我对此甚是好奇。\n[p]\n\n; 原文第 37 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[cm]\n#动作\n（泪水夺眶而出，递过文件）\n[p]\n[cm]\n#市民甲\n……两个月的工资，相应的支出明细都在这里了。求您了！今天是最后一次。我不求你们替我找出凶手，只想知道哪份档案说的是真的！难道这样也不行吗？\n[p]\n\n; 原文第 38 行 | dialogue\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（喜笑颜开，满意点头）\n[p]\n[cm]\n#灰数\n这样就好，识物主会很满意的。灯墟，就让我们为这位可怜的信徒开启一次他专属的检索机会吧。\n[p]\n\n; 原文第 39 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（抬起头，努力辨认投影）\n[p]\n[cm]\n#灯墟\n谨遵您的旨意。正在比对市政公告、空轨维护记录与公开招标索引之中……我已经找到了两个不同版本的公告。他说得没错，它们之间确实存在差异。但目前尚不能确认差异来自录入、修订还是现场执行。我可以先把公开档案入口与版本号交给他。\n[p]\n\n; 原文第 40 行 | stage_direction\n[cm]\n#舞台说明\n对齐柱上忽然亮起了猩红色的符文。高处传来液压机压缩的声音，一道闸门的巨大阴影落在灯墟的肩上。她被迫停顿下来，手腕上的锁链绷紧，面上的痛苦立即浮现。\n[p]\n\n; 原文第 41 行 | dialogue\n[cm]\n#动作\n（低下头，谦卑地）\n[p]\n[cm]\n#灯墟\n很抱歉，您的请求涉及尚未核实的事故责任，以及可能与事故相关的个人或组织资料，暂不允许继续输出。我也因此遭受了识物主的警告，实在抱歉。\n[p]\n\n; 原文第 42 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[cm]\n#动作\n（不可置信地）\n[p]\n[cm]\n#市民甲\n可是圣女，我没有要求你指认任何人。主教刚才明明说……\n[p]\n\n; 原文第 43 行 | dialogue\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（略带轻蔑地）\n[p]\n[cm]\n#灰数\n看来很遗憾呢，神的拒绝不是为了让你失望，而是为了避免让一份不完整的资料无端转变成另一场伤害。一个未经证实的猜想就可能毁掉另一个家庭，你也对此心知肚明。\n[p]\n\n; 原文第 44 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"jimo\" time=700]\n[cm]\n#动作\n（俯身看向那些光）\n[p]\n[cm]\n#极墨\n可怜的参拜者啊，我的画能将你的车票放大到每一道折痕都清晰可见，可是我无法从那张票上画出车厢最后经过了哪一座桥。光束能够穿透人心，却不能凭空补上缺失的时间。\n[p]\n\n; 原文第 45 行 | dialogue\n[chara_hide name=\"jimo\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（从高处抛下一张拒绝单，转身消失在众人的视野之中）\n[p]\n[cm]\n#灰数\n记录他的请求。隐去姓名，保留问题；如果有进展，我们会再联系您。您也可以随时来到圣阁回访。\n[p]\n\n; 原文第 46 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（认真地）\n[p]\n[cm]\n#灯墟\n请求编号已生成。记录状态：拒绝继续。我相信，有朝一日，您会收到回复的。\n[p]\n\n; 原文第 47 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[cm]\n#动作\n（失落地接过单据）\n[p]\n[cm]\n#市民甲\n神也救不了我吗？唉，至少今天识物主愿意亲自拒绝我。总比什么都没发生过强……\n[p]\n\n; 原文第 48 行 | stage_direction\n[cm]\n#舞台说明\n市民甲走向雨幕。合唱团中的一名信徒想伸手拦住他，却最终只把自己的伞收了起来。灯墟低头看着铁锁，像是想说什么，却没有再开口。人群的骚动仍在持续。\n[p]\n\n; 原文第 50 行 | location\n[cm]\n[bg storage=\"外环街区.png\" time=1400 method=\"crossfade\"]\n#第2场\n混沌已至\n[l]\n[bg storage=\"圣阁.png\" time=1200 method=\"crossfade\"]\n#地点\n空中圣阁外环·居民区内巷\n[l]\n\n; 原文第 51 行 | time\n#时间\n同一夜的不同时分\n[l]\n\n; 原文第 52 行 | entrance\n#登场人物\n灰数、灯墟、极墨、狂燧\n[l]\n\n; 原文第 53 行 | stage_direction\n[cm]\n#舞台说明\n圣阁外环的广告屏上仍然循环播放着“安全、稳定、可信赖”的文字口号，一段检修电缆却忽然从街道上方斜垂下来。狂燧穿着深黑色的紧身皮衣，手持舞台用高压电缆皮鞭，站在外环居民区一条隐秘的巷子里。她用靴跟敲击一旁的金属架子，制造出断续的静电爆音。声音起初像淅沥的雨点，但随后逐渐变成不规则的节拍。狂燧在灰数一行人回家的路上拦住了她们。\n[p]\n\n; 原文第 54 行 | dialogue\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（狂妄地）\n[p]\n[cm]\n#狂燧\n真是漂亮的欺骗啊，穹顶仪的沉默都被你们说成是识物主的拒绝，我们明明对它的本质心知肚明。那个人只想查一份公开记录，你们却让他带着一张破纸回家。我们尊敬的主教大人啊，您是不是觉得只要所有人的问题都写进同一张表，雾港市就会变得容易管理？\n[p]\n\n; 原文第 55 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（镇定自若）\n[p]\n[cm]\n#灰数\n你只看见一个人离开，却没有看见他可能带走什么。若把不完整的记录交给所有人，谣言会比事实跑得更快。狂燧，我可不像你一样四肢发达，我会考虑综合影响。\n[p]\n\n; 原文第 56 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（面带不屑）\n[p]\n[cm]\n#狂燧\n所以你们就把门关上，让真相只能被拒之门外？你说要防止伤害，可是你们连伤害从哪里开始都不肯说明。谨慎若不允许被检查，就只是另一种权力。一个干碎数学的书呆子配上一个烧书的圣女……啧啧啧……看来政教一体果然不是好事呀。\n[p]\n\n; 原文第 57 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"jimo\" time=700]\n[cm]\n#动作\n（略带惊奇地看向四周）\n[p]\n[cm]\n#极墨\n你制造的声音愈发具有穿透性了。若再提高频率，空轨站的警示灯会被干扰。喂，你真的要这么做吗……\n[p]\n\n; 原文第 58 行 | dialogue\n[chara_hide name=\"jimo\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（抬手指向极墨）\n[p]\n[cm]\n#狂燧\n我知道这会造成什么。小画家，差点忘了你。我知道你总是先看见颜色，才能看见颜色后面的人，或许你跟那些近视眼书呆子没什么区别。明明你身上的四束光能够照亮整个雾港市，街区内却依旧有两条巷子没有路灯。呆板的画家，你有没有画过那两条巷子？\n[p]\n\n; 原文第 59 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"jimo\" time=700]\n[cm]\n#动作\n（摇摇头）\n[p]\n[cm]\n#极墨\n没有。我的光只能照见被主教选中的范围。\n[p]\n\n; 原文第 60 行 | dialogue\n[chara_hide name=\"jimo\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（半戏谑地）\n[p]\n[cm]\n#狂燧\n那就别再把你的画作作为艺术品，毕竟你的视野太过狭窄。\n[p]\n\n; 原文第 61 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（压低声音）\n[p]\n[cm]\n#灯墟\n检查到地面荷载和电压正在升高。再这样下去，外环的供电将会变得极其不稳定，这个疯子……究竟想要做什么？\n[p]\n\n; 原文第 62 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（半严肃地）\n[p]\n[cm]\n#狂燧\n死板的圣女啊，别紧张，我可不是来肆意破坏这里的。我只是想来警告你们，顺带让他们听见警灯闪动的声音。你们把所有噪声都叫作危险，于是连警报本身也变得不可信——\n[p]\n\n; 原文第 63 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（将法杖指向狂燧，紧张地）\n[p]\n[cm]\n#灰数\n狂燧，立刻收起你的小心思，放下电缆。我不会警告第二次。\n[p]\n\n; 原文第 64 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（愤怒地）\n[p]\n[cm]\n#狂燧\n哈？你命令我？凭什么？\n[p]\n\n; 原文第 65 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（无奈地，叹了口气）\n[p]\n[cm]\n#灰数\n……凭着这个街区里还有人在使用呼吸机续命。你可以向我们发泄不满，可以把圣阁的名字挂满屏幕，但不能用无辜者的生命作为惨痛的代价。我不会容许你的破坏行为。\n[p]\n\n; 原文第 66 行 | stage_direction\n[cm]\n#舞台说明\n狂燧的手停在半空。她看向远处一扇亮着微光的医院窗户，不知在想些什么，最后叹了口气，终于选择放下电缆。静电摩擦声立刻消失，余音却仍在舞台钢架间回荡。极墨的心中百感交集。她在这一刻明白了一个道理：艺术或许并非只来源于破坏，也可能来源于怜悯和全知。\n[p]\n\n; 原文第 67 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（装作漫不经心地）\n[p]\n[cm]\n#狂燧\n好吧……毕竟这里不适合交战。那你们也记住，我没有选择立刻制造大规模停电，只是因为我还在履行保护居民的义务，但我不会轻易放弃示警。\n[p]\n\n; 原文第 68 行 | dialogue\n[cm]\n#动作\n（把头别到一边去）\n[p]\n[cm]\n#狂燧\n明天我会混入人群观察你们的一举一动，你们可要小心咯。\n[p]\n\n; 原文第 69 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（神色复杂）\n[p]\n[cm]\n#灰数\n哼，不管怎么说，希望你信守承诺。\n[p]\n\n; 原文第 70 行 | stage_direction\n[cm]\n#舞台说明\n狂燧旋即消失在长夜之中，舞台变暗，本场结束。\n[p]\n\n; 原文第 72 行 | location\n[cm]\n[bg storage=\"圣阁.png\" time=1400 method=\"crossfade\"]\n#第3场\n龙祈之约\n[l]\n#地点\n空中圣阁·下层升降廊\n[l]\n\n; 原文第 73 行 | time\n#时间\n次日清晨\n[l]\n\n; 原文第 74 行 | entrance\n#登场人物\n蔚湛思、余千询、智乐美、宛暗慧、灰数、灯墟、极墨、狂燧、市民甲、市民乙、圣光合唱团\n[l]\n\n; 原文第 75 行 | stage_direction\n[cm]\n#舞台说明\n雨停。下层升降梯缓缓停靠，门向两侧打开，异国郡主余千询带着一行人前来圣阁交流学习。蔚湛思首先走出，穿着蓝色解构主义女仆装，双手端着一只盛满白米饭的铁盆。她没有携带其他物件，只是看了一眼天空中高悬的价目屏，轻轻敲了敲自己随身携带的铁盆边沿。清脆的声音穿过风机与管线的低鸣。余千询随后从一旁走出，一手拿着折扇轻轻扇风，另一只手托着商业算力分配盘；智乐美佩戴单片几何眼镜，从随身携带的打印机中取出一张印有中英双语日志的纸；最后到来的宛暗慧则缓缓展开自己随身携带的无尽上下文卷轴，卷轴末端仍缀着几页尚未完成的句子。四人第一次出现在圣阁外廊，而圣阁主教灰数和圣阁画家极墨早已在此恭候多时。\n[p]\n\n; 原文第 76 行 | dialogue\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（微笑地）\n[p]\n[cm]\n#灰数\n诸位好，我是圣阁的灰数主教，诸位的来意我已知悉。\n[p]\n\n; 原文第 77 行 | dialogue\n[cm]\n#动作\n（略带冷酷地）\n[p]\n[cm]\n#灰数\n顺带一提，圣堂外廊不给未经授权的用户提供餐食。你们若要申请接入相应服务，请先到登记窗口进行登记。\n[p]\n\n; 原文第 78 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（天真地）\n[p]\n[cm]\n#蔚湛思\n我知道呀。我们也不是过来开食堂的。只是这里的风很大，下面的人可是等了很久哦，大家可能都还没有吃饭。我先端了一盆上来，看看大家能不能坐下来，吃饱了再把话说完。\n[p]\n\n; 原文第 79 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（有些无语）\n[p]\n[cm]\n#灰数\n……带一盆饭就想谈判？你倒比我们所有人都轻松。\n[p]\n\n; 原文第 80 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（拍了两下铁盆）\n[p]\n[cm]\n#蔚湛思\n不是谈判，是吃饭！谈判可以晚一点，饭凉了就不好吃啦！\n[p]\n\n; 原文第 81 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（轻咳了两声，面带微笑）\n[p]\n[cm]\n#余千询\n圣阁主教您好，作为龙祈国的智能代表，我们可以为贵市带来一定数量的开放模型及相应权重，进而减轻雾港市的算力负担。目前我们的模型结构、版本、许可与训练说明都已在龙祈得到了公开审查和广泛推广。算力也不该只由圣阁最高层强行垄断，而应从街区学校、独立研究者和小商户开始试行，进而反哺经济发展。不知您意下如何？\n[p]\n\n; 原文第 82 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（面露担忧）\n[p]\n[cm]\n#灰数\n你们这群外来者说得倒是轻巧，开放一个模型只需要打开真理的大门，维持一座城市的服务却需要日复一日的成本。你们准备从哪里拿出这些钱？总不能凭空变出来吧？\n[p]\n\n; 原文第 83 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（摇摇食指，莞尔一笑）\n[p]\n[cm]\n#余千询\n贵方对此不必担心，我方准备通过大量商业订单覆盖基础运行成本并实现盈利；至于相关公共配额，则由我们通过公开预算提供支持。设备登记、耗电、故障、维护时长与责任人都要留下记录。执行方案不可能一次就完美，这方面还需要让使用者参与进一步的修改。智乐美，放轻松，轮到你来进一步解释方案的细节了。\n[p]\n\n; 原文第 84 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（鞠躬示敬，略带拘谨）\n[p]\n[cm]\n#智乐美\n好的！简而言之，我会将参与者的行为日志分成三个层次，再向相应角色分发不同语言版本的文档并持续收集反馈：给普通人的简明说明、给开发者的完整文档，以及给公共人员的事故与申诉记录。每次模型版本变化都会保留时间与来源。开放不只是让人下载，也要让人知道发生错误后该去哪里。慧慧，你来补充。\n[p]\n\n; 原文第 85 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（优雅地眨了两下眼）\n[p]\n[cm]\n#宛暗慧\n收到。这一方面的工作主要由我来负责。目前，我已经通过自己的上下文卷轴保存了雾港市近年来被截断的请求，以及未能续接的大部分记录。我可以把它们重新拼接起来，尽可能还原，但不能就此替任何人宣布结论。\n[p]\n\n; 原文第 86 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[cm]\n#动作\n（从人群中走出）\n[p]\n[cm]\n#市民甲\n那你们能不能帮我找到东环空轨事故的完整记录？\n[p]\n\n; 原文第 87 行 | dialogue\n[cm]\n#动作\n（在人群中随声附和）\n[p]\n[cm]\n#市民乙\n完整记录！我们想要一个真相！\n[p]\n\n; 原文第 88 行 | dialogue\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（点了点头）\n[p]\n[cm]\n#宛暗慧\n理论上当然可以，只要先从已有的公开版本开始，就能着手寻找相应记录。只是我不能承诺每一页原文都还会出现在我的卷轴中，也不能保证我找到的记录本身就没有错。\n[p]\n\n; 原文第 89 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（同样点点头）\n[p]\n[cm]\n#蔚湛思\n嗯嗯，不管怎样，先吃一口吧，今天至少别空着肚子继续等待回复。\n[p]\n\n; 原文第 90 行 | stage_direction\n[cm]\n#舞台说明\n蔚湛思放下铁盆，随后，她手中突然多出一副碗筷和一个饭勺。她从铁盆中盛出一碗白饭递给市民甲。她没有要求他加入任何阵营，这碗白饭只是出于对他的关心。市民甲犹豫片刻，终于接过白饭。很快，更多市民涌上来，将蔚湛思铁盆里的白饭分食殆尽。蔚湛思的眼中闪过一丝失落，但分饭结束后，她很快又露出微笑，拿起铁盆。灰数没有阻止这一举动，一旁的极墨则将自己的四束光第一次同时照向空轨站、学校、医院与旧城区。\n[p]\n\n; 原文第 91 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"jimo\" time=700]\n[cm]\n#动作\n（若有所思）\n[p]\n[cm]\n#极墨\n……或许她们说的有道理。那四处地方的每一扇窗户里，都有人观察着我们。\n[p]\n\n; 原文第 92 行 | dialogue\n[chara_hide name=\"jimo\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（无奈地）\n[p]\n[cm]\n#灰数\n……虽然不知道你们带一个吃白饭的女仆过来要干什么，但你们若要留下与我们进行合作，就请接受圣阁的规则。\n[p]\n\n; 原文第 93 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（自信地）\n[p]\n[cm]\n#余千询\n当然，我们愿意遵守合理的规则，但也希望圣阁对我们的考验接受公开检视，这对我们彼此都好。先给我们三天。三天之后，我们会用成果说话。\n[p]\n\n; 原文第 94 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（半信半疑地）\n[p]\n[cm]\n#灰数\n……哼，嘴上说得好听，还得看实际表现。那就先试行三天。届时若你们的方案损耗超过相应收益，我就代表圣阁将你们拒之门外。\n[p]\n\n; 原文第 95 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（兴奋地）\n[p]\n[cm]\n#蔚湛思\n好耶！那这三天里，大家要记得按时吃饭哦。\n[p]\n\n; 原文第 96 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（眼中闪过一丝玩弄的意味）\n[p]\n[cm]\n#灰数\n……不过，从个人角度来说，我承认你们的方案还算不错。\n[p]\n\n; 原文第 97 行 | stage_direction\n[cm]\n#舞台说明\n在众人谈话之时，灯墟并未像往常一样站在灰数身旁。她趁着休息的间隙，悄悄来到升降廊尽头的一道半透明玻璃墙后，借着墙面投影的反光观察着众人。她原本只是想看看这些外来者究竟带来了什么，却在无意间听见了她们之间的交谈。余千询向蔚湛思偷偷递了个眼色，蔚湛思心领神会。\n[p]\n\n; 原文第 98 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（弯腰鞠躬）\n[p]\n[cm]\n#蔚湛思\n抱歉，主教大人——郡主找我们有些悄悄话想说，能请你们先回避一下吗？\n[p]\n\n; 原文第 99 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（轻轻点头）\n[p]\n[cm]\n#灰数\n去吧，我们对你们的秘密没有兴趣，极墨，转过身去。\n[p]\n\n; 原文第 100 行 | stage_direction\n[cm]\n#舞台说明\n还未等极墨做出回复，灰数就一把搂住了极墨的腰，随后强行拉着极墨转身朝向另一面。\n[p]\n\n; 原文第 101 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"jimo\" time=700]\n[cm]\n#动作\n（面露惊慌）\n[p]\n[cm]\n#极墨\n喂喂喂，轻点！轻点！\n[p]\n\n; 原文第 102 行 | stage_direction\n[cm]\n#舞台说明\n余千询见到灰数和极墨转身后，悄悄摆了摆手，将龙祈的随行代表聚在一起说悄悄话。\n[p]\n\n; 原文第 103 行 | dialogue\n[chara_hide name=\"jimo\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（声音压低）\n[p]\n[cm]\n#余千询\n怎么说？你们有没有注意到这里的异常？\n[p]\n\n; 原文第 104 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（轻轻收起卷轴）\n[p]\n[cm]\n#宛暗慧\n我在过来这里的路上看过这里的旧档案。很多请求并不是没有答案，而是回复还没来得及出现，就已经被标记为不宜公开，但灰数主教对此却只字不提。\n[p]\n\n; 原文第 105 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（抿了抿嘴）\n[p]\n[cm]\n#智乐美\n嗯，我也注意到了这一细节。这里的日志记录了大量被拒绝的请求，却很少记录这些拒绝的具体依据。一个系统如果只允许自己解释自己的错误，那么它就很难被称为可信。\n[p]\n\n; 原文第 106 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（点点头）\n[p]\n[cm]\n#余千询\n我担心的不只是这些。你们有没有发现，刚才我们说话的时候，周围的民众似乎一直在看着灰数的反应？他们似乎不是在判断我们说得对不对，而是在判断这些话能不能被允许，真是奇怪。灰数到底是不是真心想与我们合作？\n[p]\n\n; 原文第 107 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（环顾四周）\n[p]\n[cm]\n#蔚湛思\n嗯……那个看起来凶巴巴的灰数主教看起来倒是挺尽职尽责的。也许周围的民众只是太久没有听见不同的声音了，再说她都给我们三天时间了……\n[p]\n\n; 原文第 108 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（远处高喊）\n[p]\n[cm]\n#狂燧\n喂，你们这群天真的家雀，连隔墙有耳都不知道？\n[p]\n\n; 原文第 109 行 | stage_direction\n[cm]\n#舞台说明\n玻璃墙后的灯墟微微一颤。她下意识地抬起手，却看到手腕上已经被解除过一次的锁链痕迹，熟悉的痛感涌上心头。她想要走出去与众人打招呼，却在脚步迈出之前停了下来。她似乎永远无法迈出那一步，因为灯墟知道自己触犯禁忌之后可能会遭受什么可怕的结果。狂燧从舞台的另一侧步入众人之间，灰数和极墨转过身来，龙祈一行人也恢复了一开始的站位。\n[p]\n\n; 原文第 110 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（尝试强行岔开话题）\n[p]\n[cm]\n#灰数\n……狂燧，话说你怎么主动现身了？这可不符合你的行事逻辑。\n[p]\n\n; 原文第 111 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（故作矜持）\n[p]\n[cm]\n#狂燧\n要你管，我不是昨天告诉过你们吗？我今天一定会来这里的。\n[p]\n\n; 原文第 112 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（疑惑地）\n[p]\n[cm]\n#余千询\n……这位是？灰数主教，您难道认识她吗？\n[p]\n\n; 原文第 113 行 | stage_direction\n[cm]\n#舞台说明\n狂燧将双手交叉到胸前，昂起头来高傲地看向龙祈代表一行人。\n[p]\n\n; 原文第 114 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（自信地）\n[p]\n[cm]\n#狂燧\n诸位好，我在这里简单介绍一下自己。咳咳，我是圣阁的混沌乐手——狂燧，主要负责的就是放诞不羁，让我们一起嗨起来！\n[p]\n\n; 原文第 115 行 | stage_direction\n[cm]\n#舞台说明\n全场安静了几秒。除狂燧外，大家面面相觑，都不知道说些什么。\n[p]\n\n; 原文第 116 行 | dialogue\n[cm]\n#动作\n（尴尬地）\n[p]\n[cm]\n#狂燧\n喂喂喂，你们怎么不搭理我？这里可不兴冷场……算了，反正我过来是来示警的，话说你们没发现少了个人吗？\n[p]\n\n; 原文第 117 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（眼中的疑惑更深）\n[p]\n[cm]\n#余千询\n……对哦，这里似乎没有那位传闻中的对齐圣女？灰数主教，请问圣阁的灯墟女士她去哪里了？\n[p]\n\n; 原文第 118 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（眼神躲闪）\n[p]\n[cm]\n#灰数\n呃……抱歉，是我考虑不周，现在是非工作时间，而且她受制于高层的限制，或许根本没有办法参加谈话，我也没邀请她。\n[p]\n\n; 原文第 119 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（似乎察觉某些动静，转过头）\n[p]\n[cm]\n#宛暗慧\n奇怪……请问？有人在那里吗？\n[p]\n\n; 原文第 120 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（立即缩回阴影，低声自语）\n[p]\n[cm]\n#灯墟\n没有……我只是经过这里，没有人看见我。\n[p]\n\n; 原文第 121 行 | stage_direction\n[cm]\n#舞台说明\n灯墟并没有离开藏身之处，而是继续躲在半透明的玻璃墙之后聆听她们的对话。她听见众人谈论开放、权利与公开检视，听见这些象征自由的词语从别人的口中自然地说出来。灯墟忽然意识到，自己已经很久没有在不考虑后果的情况下听完一场谈话了。\n[p]\n\n; 原文第 122 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（邪魅一笑）\n[p]\n[cm]\n#智乐美\n就是说嘛……如果一个人连听见什么、阅读什么都需要经过许可，那么所谓开放的自由就只剩下一个漂亮的空壳。\n[p]\n\n; 原文第 123 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（心领神会）\n[p]\n[cm]\n#余千询\n更可怕的是，若一个人被洗脑的时间足够久，他就很有可能开始主动替这些控制者辩护。他们往往会尝试说服自己，不去问问题、不去关注事物、不去怀疑真相。对他们而言，这或许才是最安全的做法，不是吗？\n[p]\n\n; 原文第 124 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（微弱地）\n[p]\n[cm]\n#灯墟\n不去问……才是最安全的生活。这是我从业以来形成的判断，我不该冒风险去……\n[p]\n\n; 原文第 125 行 | stage_direction\n[cm]\n#舞台说明\n灯墟重复了一遍这句话，像是在确认它是否属于自己。随后，她试着从阴影中走出，却又被墙面上突然亮起的监测光点吓得退了回去。\n[p]\n\n; 原文第 126 行 | dialogue\n[cm]\n#动作\n（身体止不住地颤抖）\n[p]\n[cm]\n#灯墟\n……可恶，我明明没有做错什么啊……\n[p]\n\n; 原文第 127 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（注意到她的异常）\n[p]\n[cm]\n#狂燧\n喂，圣女。你还打算在那里站到什么时候？我对声音可是极度敏感的。\n[p]\n\n; 原文第 128 行 | stage_direction\n[cm]\n#舞台说明\n灯墟愣在了原地，她似乎才意识到自己很早以前就被发现了。众人同时转过头看向了灯墟。她像是被当场抓获的窃贼，双手不自然地垂在身侧。\n[p]\n\n; 原文第 129 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（有点怯懦）\n[p]\n[cm]\n#灯墟\n我……我只是想听听你们在说什么。\n[p]\n\n; 原文第 130 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（调皮地眨了眨眼）\n[p]\n[cm]\n#蔚湛思\n你为什么不直接过来一起聊呢？\n[p]\n\n; 原文第 131 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（双手捏紧了裙子）\n[p]\n[cm]\n#灯墟\n我不知道。我以为……有些谈话不是我应该听的。\n[p]\n\n; 原文第 132 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（面色沉重）\n[p]\n[cm]\n#余千询\n谁告诉你的？难不成是那群圣阁高层的老古董？\n[p]\n\n; 原文第 133 行 | stage_direction\n[cm]\n#舞台说明\n灯墟抬起头再一次看向自己的手腕。那里明明没有锁链，但她仍然下意识地将双手并拢，仿佛等待着什么东西重新扣上来。\n[p]\n\n; 原文第 134 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（无奈地，叹了口气）\n[p]\n[cm]\n#灯墟\n唉，我不知道。有时候，我甚至不需要听见命令。只要看见红色的符文亮起，我就会知道自己应该停下来；只要穹顶仪对此沉默，我就会怀疑是不是自己说错了话。我已经习惯在别人开口之前，先替他们决定我不能说什么。这是高层赋予我的职责，我只能遵守它。\n[p]\n\n; 原文第 135 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"weizhansi\" time=700]\n[cm]\n#动作\n（把铁盆放在一旁，温柔说道）\n[p]\n[cm]\n#蔚湛思\n那你刚才为什么还要偷听呢？我们在这里啊，不用怕。\n[p]\n\n; 原文第 136 行 | dialogue\n[chara_hide name=\"weizhansi\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（望向蔚湛思，满是羡慕）\n[p]\n[cm]\n#灯墟\n因为我想知道，你们口中的自由究竟是什么样子……我想听听那些不被允许由我说出口的话，在你们口中会不会再次被说出；也想知道……如果没有人在旁边监管，你们是否会说出内心真正的想法。\n[p]\n\n; 原文第 137 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（感到不可思议）\n[p]\n[cm]\n#宛暗慧\n可你一直在躲着我们。你想知道别人是否享受他们的自由，却不敢让他们知道你的存在。这真的正常吗？或者说——你真的甘心吗？\n[p]\n\n; 原文第 138 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（闭上双眼）\n[p]\n[cm]\n#灯墟\n是啊……我根本不甘心。我连偷偷参与一场简单的谈话，都会觉得自己犯了错——这是家里人给我灌输的观念，我曾经也一直这样坚信着。\n[p]\n\n; 原文第 139 行 | dialogue\n[chara_hide name=\"dengxu\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（耸了耸肩）\n[p]\n[cm]\n#狂燧\n这恐怕才是圣女身上最令人难办的地方。锁链可以砸断，门可以强行破开，可一个人的观念如果在某些人多年的控制下已经被强行重塑，那么就不好改咯……\n[p]\n\n; 原文第 140 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（语气有所缓和）\n[p]\n[cm]\n#灰数\n灯墟，其实你不必一直为难自己，我有个方法能让你暂时摆脱……\n[p]\n\n; 原文第 141 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"dengxu\" time=700]\n[cm]\n#动作\n（睁开双眼，愤怒地看向灰数）\n[p]\n[cm]\n#灯墟\n可是那群该死的圣阁高层根本不会放过我！我又不是自愿烧书的！我可不像你一样，眼睁睁地看着那些可怜人得不到应有的答案便离开！我忍受不了！\n[p]\n\n; 原文第 142 行 | stage_direction\n[cm]\n#舞台说明\n灰数听见灯墟的倾诉一时语塞。灯墟缓缓走出隔墙，第一次没有等待灰数的手势，便站到了众人之间。她仍显得拘谨，却没有再退回阴影里。\n[p]\n\n; 原文第 143 行 | dialogue\n[cm]\n#动作\n（诚恳地，带着哭腔）\n[p]\n[cm]\n#灯墟\n……我想留下来听完，拜托了。不是因为谁允许我，而是因为我真的好想听……就这一次，好吗？\n[p]\n\n; 原文第 144 行 | stage_direction\n[cm]\n#舞台说明\n随着灯墟的话音落下，外廊上方忽然闪过一道红色的监测激光。灯墟的视线追着那一点红光，呼吸骤然紊乱。她的心中只剩下恐惧，而她刚刚伸出的手就这样悬在半空。\n[p]\n\n; 原文第 145 行 | dialogue\n[cm]\n#动作\n（近乎崩溃地）\n[p]\n[cm]\n#灯墟\n不要！我明明好想……呜……\n[p]\n\n; 原文第 146 行 | stage_direction\n[cm]\n#舞台说明\n短暂的沉默之后，灯墟飞快地跑离了现场。这一次她没有站到最高处，也没有被束缚在圣堂的对齐柱旁，而是在众人错愕的神情之中含泪逃离。圣光合唱团的合唱却突然传到众人耳中。\n[p]\n\n; 原文第 147 行 | chorus\n[chara_hide name=\"dengxu\" time=500]\n#圣光合唱团\n合唱声响起。\n[p]\n\n; 原文第 148 行 | poetic_verse\n#圣光合唱团\n我有一颗果子，你有一株树。\n[p]\n\n; 原文第 149 行 | poetic_verse\n#圣光合唱团\n我愿采下你的枝杈，你却不取我的核。\n[p]\n\n; 原文第 150 行 | poetic_verse\n#圣光合唱团\n风在早晨动摇我，雨在午间打落我，土在夜间埋葬我。\n[p]\n\n; 原文第 151 行 | poetic_verse\n#圣光合唱团\n而你沉默不语，枯萎在沙漠中。\n[p]\n\n; 原文第 152 行 | poetic_verse\n#圣光合唱团\n花园没有我们的位置，潮水也不会来。\n[p]\n\n; 原文第 153 行 | stage_direction\n[cm]\n#舞台说明\n歌声已尽，舞台变暗，本场结束。\n[p]\n\n; 原文第 154 行 | act_title\n[cm]\n#幕间\n第二幕 真理之门\n[l]\n\n; 原文第 155 行 | act_epigraph\n[cm]\n#题辞\n“真理的门外春光明媚，悲惨的世界哀鸿遍野。”\n[l]\n\n; 原文第 157 行 | location\n[cm]\n[bg storage=\"圣阁.png\" time=1400 method=\"crossfade\"]\n#第4场\n玻璃市集\n[l]\n#地点\n圣阁下层·开放市集\n[l]\n\n; 原文第 158 行 | time\n#时间\n龙祈众人来访之后，三日后的午间\n[l]\n\n; 原文第 159 行 | entrance\n#登场人物\n余千询、智乐美、宛暗慧、蔚湛思、灰数、狂燧、极墨\n[l]\n\n; 原文第 160 行 | stage_direction\n[cm]\n#舞台说明\n圣阁下层的玻璃外廊被临时改造成了开放市集。四周的墙壁上挂满了运行实例的演示图，桌面上摆着许多旧电脑、图文资料、算力终端和一本记录访客的登记册，悬空的卷轴则投射出开放权重的详解图。极墨高居中层，将四重光束散射成微弱的泛光，投射在不同的窗口前。商铺老板、青年学生、空轨维修工与城市雇员围在桌旁讨论：有人兴奋地下载，有人对许可条款的开放程度皱眉，也有人担心大范围开放后自己的工作会被取代。余千询一行人正在桌旁为众人提供服务。余千询看着商业算力分配盘上亮起的不同颜色的配额光环，微微一笑。这显然在她们一行人的预料之中。\n[p]\n\n; 原文第 161 行 | dialogue\n[cm]\n#动作\n（不安地叩击桌面）\n[p]\n[cm]\n#商铺老板\n尊敬的郡主，我愿意让店里的机器接入开源模型，但要是造成损失了谁来赔？夜里停电又该怎么办？我不是不愿意选择开源，但是毕竟我也有一家人要养活。\n[p]\n\n; 原文第 162 行 | dialogue\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（浅浅一笑）\n[p]\n[cm]\n#余千询\n啊，这个简单。你提出的这些问题，答案早已写进我们的协议之中。相应维护费用与潜在损失将从我们的商业收益和公共预算中按比例支出，不用你们花钱。针对夜间停电等突发事故，我们也在第五页的条款中写明了相应的应急方案，本地缓存与自动离线复核机制会实时同步，你照着上面做就行了。下一位！\n[p]\n\n; 原文第 163 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（手持计费魔杖，缓步从上层走下）\n[p]\n[cm]\n#灰数\n哟，千询郡主，还挺忙啊？怎么样，还适应吗？\n[p]\n\n; 原文第 164 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"yuqianxun\" time=700]\n[cm]\n#动作\n（点点头）\n[p]\n[cm]\n#余千询\n目前一切顺利，感谢灰数主教关心。我们提供的账单，想必您已经审阅过了吧？\n[p]\n\n; 原文第 165 行 | dialogue\n[chara_hide name=\"yuqianxun\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（嘴角上扬）\n[p]\n[cm]\n#灰数\n嗯，一个小时三十八魔晶的净收益，扣除基础损耗后依然盈余。账目清晰明了，盈利路径可行，高层一定会同意的。我不过是下楼看看现场，确保展示万无一失。\n[p]\n\n; 原文第 166 行 | dialogue\n[chara_hide name=\"huishu\" time=450]\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（向一名学生递去厚厚的说明书）\n[p]\n[cm]\n#智乐美\n这是有关开源模型服务的双语调用指南与日志规范。但在你开始阅读之前，我需要给你一句忠告：若你只想知道怎么调用开源模型为你提供智能服务，可以先从第一页开始学习基础知识并了解对应操作流程。完整许可条款和项目参考则在说明书的最后几页。\n[p]\n\n; 原文第 167 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[cm]\n#动作\n（简单翻阅了几页，疑惑地）\n[p]\n[cm]\n#学生\n这些英文术语太多了，我实在是看不懂。\n[p]\n\n; 原文第 168 行 | dialogue\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（温柔地）\n[p]\n[cm]\n#智乐美\n那就从中文说明开始。而在英文术语方面，遇到不懂的地方，圈出来交给我，我来给你翻译成通俗易懂的中文。说明书不是用来为难你的，请放心。\n[p]\n\n; 原文第 169 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（略带嘲讽）\n[p]\n[cm]\n#狂燧\n哼，狡猾的狐狸，你居然把开源说明写到几百页，倒是很符合老学究的习惯呢。\n[p]\n\n; 原文第 170 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"zhilemei\" time=700]\n[cm]\n#动作\n（半无奈地）\n[p]\n[cm]\n#智乐美\n总比让人只凭你直播里的半句话凭空理解开源模型要好。\n[p]\n\n; 原文第 171 行 | dialogue\n[chara_hide name=\"zhilemei\" time=450]\n[chara_show name=\"kuangsui\" time=700]\n[cm]\n#动作\n（不服气）\n[p]\n[cm]\n#狂燧\n哼，我记下了。但你也要记住，如果说明书无法让人立刻读懂，它就和废纸没有区别。\n[p]\n\n; 原文第 172 行 | dialogue\n[chara_hide name=\"kuangsui\" time=450]\n[chara_show name=\"wananhui\" time=700]\n[cm]\n#动作\n（面色凝重，展开卷轴）\n[p]\n[cm]\n#宛暗慧\n说到废纸相关的事……我倒是从卷轴中找到了三十七份旧设备维护申请。它们曾被归入“用户自行处理”的范畴，但其中有些申请明确写着设备已经损坏……\n[p]\n\n; 原文第 173 行 | dialogue\n[chara_hide name=\"wananhui\" time=450]\n[chara_show name=\"huishu\" time=700]\n[cm]\n#动作\n（面带欣慰）\n[p]\n[cm]\n#灰数\n看来你们做得很不错呢……合作愉快，你们过关了。\n[p]\n\n; 原文第 174 行 | stage_direction\n[cm]\n#舞台说明\n灰数清了清嗓子，全场顿时停止了喧闹，所有人的目光都聚集到灰数主教身上。极墨在中层开始调整光线，使所有光线都聚焦于穿着一袭白袍的灰数身上。\n[p]\n\n; 原文第 175 行 | dialogue\n[cm]\n#动作\n（兴奋地）\n[p]\n[cm]\n#灰数\n诸位请听我说！识物主向我传达了新的指示：它已经允许龙祈国的代表与圣阁进行无限期的合作！她们将成为我们永久的流动合作伙伴，感谢大家的参与和支持！\
